<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>和の書棚 ― 書院造の書斎 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&display=swap">
<style>
:root{
  --bg:#120e0b; --panel:rgba(22,15,10,.66); --panel-hover:rgba(64,42,22,.82);
  --line:rgba(214,176,98,.55); --ink:#f1e6cf; --muted:#cdbd93; --seal:#a8281f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0d0a08; --panel:rgba(18,12,8,.7); }
}
:root[data-theme="dark"]{ --bg:#0d0a08; --panel:rgba(18,12,8,.7); }
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--ink);
  font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;}
#app{position:fixed;inset:0;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#app:active{cursor:grabbing}
canvas{display:block}
.hud{position:fixed;inset:0;pointer-events:none}
.title{position:absolute;left:20px;top:18px;display:flex;gap:12px;align-items:center;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.seal{width:38px;height:38px;background:var(--seal);color:#f6e9d0;display:grid;place-items:center;
  font-weight:700;font-size:21px;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.5), inset 0 0 0 1.5px rgba(246,233,208,.35)}
.title b{display:block;font-size:19px;letter-spacing:.3em;font-weight:700}
.title small{display:block;margin-top:3px;font-size:11px;letter-spacing:.16em;color:var(--muted)}
.hint{position:absolute;left:20px;top:70px;max-width:min(80vw,440px);font-size:12px;line-height:1.9;letter-spacing:.1em;
  color:var(--muted);text-shadow:0 1px 4px #000;transition:opacity 1.6s}
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:auto;padding:0 12px;width:max-content;max-width:100%;box-sizing:border-box}
.bar button{font:inherit;font-size:13px;letter-spacing:.14em;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);padding:9px 16px;border-radius:2px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.bar button:hover{background:var(--panel-hover)}
.bar button:focus-visible{outline:2px solid #e8c878;outline-offset:2px}
.bar button.on{background:rgba(168,40,31,.78);border-color:#e0b96a}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);
  letter-spacing:.45em;font-size:14px;transition:opacity .9s;z-index:5}
@media (prefers-reduced-motion: reduce){ #loading,.hint{transition:none} }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <div class="title"><div class="seal">書</div><div><b>和の書棚</b><small>書院造 ― 違い棚と障子の書斎</small></div></div>
  <div class="hint" id="hint">ドラッグで見回す ／ ホイール・ピンチで寄る<br>障子・戸・引き出しをクリックで開閉 ／ 障子を開くと、中の和綴じの本をクリックで取り出せます<br>ダブルクリックでその場所へ</div>
  <div class="bar">
    <button id="bDay" type="button" class="on">昼にする</button>
    <button id="bReset" type="button">位置をリセット</button>
  </div>
</div>
<div id="loading">読み込み中</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
'use strict';
/* =====================================================================================
   ARCHITECTURE MAP — read this first before editing.
   One IIFE, top-to-bottom in this order:
     1. utils            small helpers: seeded rnd(), pick/clamp/lerp, C() (sRGB color)
     2. renderer / env   THREE.WebGLRenderer, camera, scene, buildEnv() reflection probe
     3. textures         canvasTex() draws a <canvas> and wraps it as a THREE texture;
                          each drawX(ctx,w,h,...) function procedurally paints one surface
                          (wood/paper/plaster/tatami/fusuma/makie/spines/scroll)
     4. materials        std() = MeshStandardMaterial/PhysicalMaterial + shared envMap;
                          matDark/matMid/matLight = wood, matLacquer/matGold = trim,
                          matPaper/matWashi = shoji & panel paper
     5. geometry helpers  box()/lathe()/mapBoxUV() build+UV-map meshes onto `shelf`
     6. room              walls, tatami floor, shoji window, hanging scroll
     7. shelf structure   the cabinet frame, shelves, doors, drawers (see "movables" below)
     8. books             fillShelf() fills a shelf run with generated paperback/hardback
                          spines; STYLE_DEFS/STYLES define the look of ordinary books
     9. 和綴之書 (wabon)   the 27 user-supplied stitched-bound books (3 sizes x 9 covers).
                          WA_* constants hold their config; placeWabonRow() lays them out
                          on the centre shelf; buildRig()/openShowcase()/updateShowcase()
                          drive the "float out, turn, open" animation (see below)
    10. andon lamp        the standing paper lamp on the right
    11. lights            sun/hemi/fill + applyMode() cross-fades day <-> night
    12. camera rig        orbit state (cur/goal), pointer + wheel handlers, dbl-click zoom
    13. buttons           day/night, shoji, drawers, auto-rotate, reset — wire up the HUD
    14. render loop        tick(): advances movables, camera, mode, showcase, then renders

   Two animation systems, don't confuse them:
     - "movables": doors/drawers/shoji. makeMovable(obj,axis,delta,tag) registers a mesh;
       tick() lerps mv.t toward mv.goal (0..1) each frame. findMv() walks up from a
       raycast hit to find the owning entry. Tag is used only to group buttons/taps
       ('shoji' toggles both leaves together; 'lower'/'tenbukuro' are per-pair).
     - "showcase" (SC): exactly one wabon book at a time. openShowcase(wa) builds a
       throwaway high-detail rig (buildRig) parented under scRoot, animates it through
       u = 0..2 (0-1 float+turn, 1-2 page-open) in updateShowcase(), and at u=0 on the
       way back it restores the shelf copy's visibility and frees the rig's geometry.

   Adding a new wabon cover colour: append to WA_COLORS (hex + title ink colour) —
   placeWabonRow()/buildRig() pick it up automatically, no other change needed.
   Adding a new plain book title: append [title, author] to TITLES near the top.

   Hidden puzzle (search "hidden puzzle" near the buttons section): an invisible catcher plane over
   the tatami in front of the shelf counts 5 taps (`trap`/tapTrap()), then openTrap() hides the real
   tile on that spot of the tatami grid (`tatamiInst`) and builds the flap/pit/stairs/door for the
   first time — nothing is built or touched before that, so there's nothing to see or flicker.
   After that first build, tapping the flap itself toggles it open/closed in one tap (toggleFlap()),
   and tapping down into the open hole (`stairsCatcherRef`) plays a scripted camera move down the
   stairs (descendStairs()). The stairs end at a locked door (`stairDoor`); tapping it shakes if
   `hasKey` is false, or swings it open once true. `hasKey` becomes true via collectShiori(), when
   the shiori tucked behind the cabinet's centre panel (`shiori`, revealed by sliding that panel —
   it's `makeMovable`'d like the doors/drawers, tag 'secret-panel') is tapped. There is no literal
   room modelled behind the cabinet or beyond the locked door yet — both simply fade to black.

   Camera (search "camera rig"): goal.target can be panned with two fingers and zoomed with a pinch
   or the wheel toward the real point under the cursor/pinch midpoint (zoomToward()/panBy()), but any
   user-driven pan is clamped to TARGET_MIN/TARGET_MAX (clampTarget()) so it can't wander into
   unbuilt parts of the room. Scripted camera moves (dblclick, the home reset, descendStairs()) set
   goal.target directly and intentionally skip that clamp.
   ===================================================================================== */
const loadingEl=document.getElementById('loading');
if(!window.THREE){ loadingEl.textContent='three.js を読み込めませんでした'; return; }

const FONT='"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif';
const TITLES=[
 ['源氏物語','紫式部'],['枕草子','清少納言'],['徒然草','兼好'],['方丈記','長明'],['万葉集',''],['古今和歌集',''],
 ['平家物語',''],['奥の細道','芭蕉'],['雨月物語','秋成'],['竹取物語',''],['伊勢物語',''],['土佐日記','貫之'],
 ['更級日記',''],['今昔物語集',''],['古事記',''],['日本書紀',''],['風姿花伝','世阿弥'],['五輪書','武蔵'],
 ['葉隠',''],['茶の本','天心'],['陰翳礼讃','谷崎'],['吾輩は猫である','漱石'],['坊っちゃん','漱石'],['こころ','漱石'],
 ['草枕','漱石'],['三四郎','漱石'],['夢十夜','漱石'],['舞姫','鷗外'],['五重塔','露伴'],['雪国','川端'],
 ['伊豆の踊子','川端'],['羅生門','芥川'],['蜘蛛の糸','芥川'],['走れメロス','太宰'],['斜陽','太宰'],['銀河鉄道の夜','賢治'],
 ['風の又三郎','賢治'],['山月記','中島'],['檸檬','梶井'],['細雪','谷崎'],['浮雲','四迷'],['たけくらべ','一葉'],
 ['遠野物語','柳田'],['学問のすゝめ','諭吉'],['蕪村句集',''],['一茶句集',''],['花伝書',''],['歎異抄',''],
 ['禅と日本文化','鈴木'],['武士道','新渡戸'],['日本の面影','八雲'],['山家集','西行']
];
try{
  const chars=TITLES.map(t=>t[0]+t[1]).join('')+'書雅和松梅綴之鴛照眛琉';
  await Promise.race([
    Promise.all([document.fonts.load('700 40px "Noto Serif JP"',chars),document.fonts.load('500 40px "Noto Serif JP"',chars)]),
    new Promise(r=>setTimeout(r,4000))
  ]);
}catch(e){}

/* ---------- utils ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(20260919);
const R=(a,b)=>a+(b-a)*rnd();
const pick=arr=>arr[Math.floor(rnd()*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const C=hex=>new THREE.Color(hex).convertSRGBToLinear();

/* ---------- renderer ---------- */
const host=document.getElementById('app');
let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
}catch(e){ loadingEl.textContent='WebGL を利用できません'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
host.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d0a08);
const camera=new THREE.PerspectiveCamera(38,1,0.05,60);
const maxAniso=renderer.capabilities.getMaxAnisotropy();

/* ---------- environment (reflections) ---------- */
function buildEnv(){
  const es=new THREE.Scene();
  const sg=new THREE.SphereGeometry(20,32,16);
  const p=sg.attributes.position, cols=new Float32Array(p.count*3);
  const top=[0.20,0.16,0.12], hor=[0.50,0.38,0.27], bot=[0.22,0.22,0.10];
  for(let i=0;i<p.count;i++){
    const y=p.getY(i)/20, a=y>=0?top:bot, k=Math.pow(Math.abs(y),0.7);
    cols[i*3]=hor[0]+(a[0]-hor[0])*k; cols[i*3+1]=hor[1]+(a[1]-hor[1])*k; cols[i*3+2]=hor[2]+(a[2]-hor[2])*k;
  }
  sg.setAttribute('color',new THREE.BufferAttribute(cols,3));
  es.add(new THREE.Mesh(sg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  const win=(w,h,pos,c)=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c[0],c[1],c[2]),side:THREE.DoubleSide}));
    m.position.set(pos[0],pos[1],pos[2]); m.lookAt(0,1,0); es.add(m);
  };
  win(10,6,[-14,6,8],[6,5.4,4.4]);
  win(14,4,[10,10,14],[2.4,2.3,2.2]);
  win(20,10,[0,14,0],[0.9,0.85,0.75]);
  const pm=new THREE.PMREMGenerator(renderer);
  const rt=pm.fromScene(es,0.03);
  pm.dispose();
  return rt.texture;
}
const envTex=buildEnv();

/* ---------- textures ---------- */
function canvasTex(w,h,draw,o){
  o=o||{};
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c);
  t.encoding=THREE.sRGBEncoding;
  if(o.repeat!==false){ t.wrapS=t.wrapT=THREE.RepeatWrapping; }
  t.anisotropy=maxAniso;
  return t;
}
function wrapped(w,h,fn){ for(const dx of [-w,0,w]) for(const dy of [-h,0,h]) fn(dx,dy); }

function drawWood(g,w,h,o){
  g.fillStyle=o.base; g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){
    const y=rnd()*h, th=R(6,60), a=R(0.04,0.14), col=rnd()<0.55?o.dark:o.light;
    for(const off of [-h,0,h]){
      const grd=g.createLinearGradient(0,y+off-th,0,y+off+th);
      grd.addColorStop(0,`rgba(${col},0)`); grd.addColorStop(0.5,`rgba(${col},${a})`); grd.addColorStop(1,`rgba(${col},0)`);
      g.fillStyle=grd; g.fillRect(0,y+off-th,w,th*2);
    }
  }
  g.lineCap='round';
  const n=o.lines*5;
  for(let i=0;i<n;i++){
    const y0=rnd()*h, col=rnd()<0.62?o.dark:o.light;
    g.strokeStyle=`rgba(${col},${R(0.05,0.28)})`;
    g.lineWidth=R(0.4,1.8);
    const amp=R(0.4,5)*o.wave, k=1+Math.floor(rnd()*4), ph=rnd()*6.283;
    for(const off of [-h,0,h]){
      g.beginPath();
      for(let x=0;x<=w;x+=16){
        const y=y0+off+Math.sin(x/w*6.283*k+ph)*amp;
        if(x===0)g.moveTo(x,y); else g.lineTo(x,y);
      }
      g.stroke();
    }
  }
  for(let i=0;i<2200;i++){
    g.fillStyle=`rgba(${o.dark},${R(0.05,0.2)})`;
    g.fillRect(rnd()*w,rnd()*h,R(2,9),R(0.5,1.2));
  }
}
function drawPaper(g,w,h,o){
  g.fillStyle=o.base; g.fillRect(0,0,w,h);
  for(let i=0;i<40;i++){
    const x=rnd()*w,y=rnd()*h,r=R(30,110);
    wrapped(w,h,(dx,dy)=>{
      const gr=g.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,r);
      gr.addColorStop(0,`rgba(${rnd()<.5?'120,90,50':'255,255,255'},.05)`); gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr; g.fillRect(x+dx-r,y+dy-r,r*2,r*2);
    });
  }
  for(let i=0;i<o.fibers;i++){
    const x=rnd()*w,y=rnd()*h,l=R(6,30),a=rnd()*6.283;
    g.strokeStyle=rnd()<.5?`rgba(255,255,255,${R(.1,.35)})`:`rgba(120,90,50,${R(.03,.12)})`;
    g.lineWidth=R(.4,1.2);
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke();
  }
  if(o.gold){
    for(let i=0;i<o.gold;i++){
      const x=rnd()*w,y=rnd()*h,s=R(1.5,6);
      g.save(); g.translate(x,y); g.rotate(rnd()*3.14);
      g.fillStyle=`rgba(${215+rnd()*25|0},${170+rnd()*25|0},${80+rnd()*30|0},${R(.35,.85)})`;
      g.fillRect(0,0,s,s*R(.4,1)); g.restore();
    }
  }
}
function drawPlaster(g,w,h,base){
  g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let i=0;i<220;i++){
    const x=rnd()*w,y=rnd()*h,r=R(30,150),dark=rnd()<.5;
    wrapped(w,h,(dx,dy)=>{
      const gr=g.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,r);
      gr.addColorStop(0,dark?`rgba(40,28,15,${R(.05,.13)})`:`rgba(255,240,215,${R(.04,.10)})`); gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr; g.fillRect(x+dx-r,y+dy-r,r*2,r*2);
    });
  }
  for(let i=0;i<9000;i++){
    g.fillStyle=rnd()<.5?`rgba(30,20,10,${R(.05,.25)})`:`rgba(255,245,225,${R(.05,.22)})`;
    g.fillRect(rnd()*w,rnd()*h,R(1,2.6),R(1,2.6));
  }
}
function drawTatami(g,w,h){
  g.fillStyle='#a8a66a'; g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=2){
    g.fillStyle=`rgba(${rnd()<.5?'255,250,190':'70,70,30'},${R(.04,.16)})`; g.fillRect(0,y,w,1);
  }
  for(let i=0;i<600;i++){
    g.fillStyle=`rgba(${rnd()<.5?'255,250,190':'70,70,30'},${R(.05,.18)})`; g.fillRect(rnd()*w,rnd()*h,R(20,120),R(1,2));
  }
  for(let x=0;x<w;x+=10){ g.fillStyle='rgba(60,60,20,.05)'; g.fillRect(x,0,1,h); }
  const b=Math.round(h*0.045);
  for(const y0 of [0,h-b]){
    g.fillStyle='#1b1d27'; g.fillRect(0,y0,w,b);
    g.fillStyle='rgba(200,180,120,.18)'; g.fillRect(0,y0===0?b-3:y0,w,3);
    for(let x=0;x<w;x+=14){ g.fillStyle='rgba(255,255,255,.05)'; g.fillRect(x,y0+b*0.3,7,b*0.4); }
  }
  g.strokeStyle='rgba(40,40,10,.45)'; g.lineWidth=3; g.strokeRect(0,0,w,h);
}
function drawFusuma(g,w,h){
  const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'#1b2c48'); gr.addColorStop(1,'#0e1626');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  const s=32;
  for(let y=0;y<h;y+=s)for(let x=0;x<w;x+=s){ if(rnd()<0.10){ g.fillStyle=`rgba(214,172,84,${R(.05,.14)})`; g.fillRect(x+1,y+1,s-2,s-2);} }
  for(let band=0;band<5;band++){
    const cy=h*(0.14+band*0.19);
    const grd=g.createLinearGradient(0,cy-20,0,cy+20);
    grd.addColorStop(0,'rgba(240,206,120,0.95)'); grd.addColorStop(1,'rgba(176,132,52,0.85)');
    g.fillStyle=grd;
    for(let k=0;k<9;k++){
      g.beginPath(); g.ellipse((k+R(-.2,.2))*w/8,cy+R(-5,5),R(46,95),R(9,16),0,0,6.283); g.fill();
    }
    for(let k=0;k<160;k++){ g.fillStyle=`rgba(240,210,130,${R(.2,.7)})`; g.fillRect(rnd()*w,cy+R(-6,32),R(1,2.6),R(1,2.6)); }
  }
}
function drawMakie(g,w,h){
  g.fillStyle='#120d0a'; g.fillRect(0,0,w,h);
  for(let i=0;i<7000;i++){
    const x=rnd()*w,y=rnd()*h,dens=Math.pow(y/h,1.6);
    if(rnd()>0.15+dens*0.85) continue;
    g.fillStyle=`rgba(${210+rnd()*30|0},${165+rnd()*30|0},${70+rnd()*30|0},${R(.15,.8)})`;
    const s=R(.6,2.4); g.fillRect(x,y,s,s);
  }
  for(let b=0;b<4;b++){
    const y=h*(.5+b*.14), gr=g.createLinearGradient(0,y-30,0,y+30);
    gr.addColorStop(0,'rgba(200,150,60,0)'); gr.addColorStop(.5,'rgba(200,150,60,.10)'); gr.addColorStop(1,'rgba(200,150,60,0)');
    g.fillStyle=gr; g.fillRect(0,y-30,w,60);
  }
}
function vtext(g,s,cx,y0,maxH,maxW,color,weight){
  const chars=[...s]; if(!chars.length) return;
  const size=Math.min(maxW,maxH/chars.length);
  g.font=`${weight} ${size}px ${FONT}`; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle=color;
  let y=y0+(maxH-size*chars.length)/2+size/2;
  for(const c of chars){ g.fillText(c,cx,y); y+=size; }
}
function goldGrad(g,w,silver){
  const gr=g.createLinearGradient(0,0,w,0);
  if(silver){ gr.addColorStop(0,'#9aa1a8'); gr.addColorStop(.5,'#f2f4f6'); gr.addColorStop(1,'#8b929a'); }
  else { gr.addColorStop(0,'#a9812f'); gr.addColorStop(.5,'#f3d580'); gr.addColorStop(1,'#a07728'); }
  return gr;
}
function drawSpine(g,w,h,st,title,author){
  g.fillStyle=st.base; g.fillRect(0,0,w,h);

function mapBoxUV(g,w,h,d,S){
  const pos=g.attributes.position,nor=g.attributes.normal,uv=g.attributes.uv;
  const dims=[w,h,d]; let L=0; if(h>dims[L])L=1; if(d>dims[L])L=2;
  const off=[rnd()*10,rnd()*10];
  for(let i=0;i<pos.count;i++){
    const p=[pos.getX(i),pos.getY(i),pos.getZ(i)];
    const n=[Math.abs(nor.getX(i)),Math.abs(nor.getY(i)),Math.abs(nor.getZ(i))];
    const na=n[0]>0.5?0:(n[1]>0.5?1:2);
    const axes=[0,1,2].filter(a=>a!==na);
    let ua,va;
    if(axes.indexOf(L)>=0){ ua=L; va=axes.find(a=>a!==L); } else { ua=axes[0]; va=axes[1]; }
    uv.setXY(i,p[ua]/S+off[0],p[va]/S+off[1]);
  }
  uv.needsUpdate=true;
}

// Bends the scroll's front/back geometry into a soft paper curl, parameterized by total bend angle A
// (0 = flat/closed). Each vertex's rest position (x0,y0) — y0 running from 0 at the fixed top edge to
// -panelH at the free bottom edge — is mapped onto a circular arc of radius R=panelH/A, so that as A
// grows from 0 the sheet rolls up and away from the wall continuously (not as separate rigid segments,
// so there are no seams), and every point's arc-length from the top edge is preserved. The bottom rod
// is repositioned each frame to sit at the curled position of the free edge, extended slightly along
// its local tangent so it keeps its original small overhang.
function updateScrollCurl(A){
  const sc=scrollCurl; if(!sc) return;
  const flat=A<1e-4;
  const R=flat?0:sc.panelH/A;
  const bend=(geo,base)=>{
    const pos=geo.attributes.position;
    if(flat){ pos.array.set(base); }
    else{
      for(let i=0;i<pos.count;i++){
        const x0=base[i*3], y0=base[i*3+1], s=-y0/sc.panelH, phi=s*A;
        pos.setXYZ(i,x0,-R*Math.sin(phi),R*(1-Math.cos(phi)));
      }
    }
    pos.needsUpdate=true; geo.computeVertexNormals();
  };
  bend(sc.frontGeo,sc.frontBase); bend(sc.backGeo,sc.backBase);
  const y1=flat?-sc.panelH:-R*Math.sin(A), z1=flat?0:R*(1-Math.cos(A));
  const tx=-Math.cos(A), tz=Math.sin(A);
  sc.bottomRod.position.set(0,y1+0.015*tx,z1+0.015*tz);
  sc.bottomRod.rotation.x=-A;
}

function fillShelf(x0,x1,y,clear,frontZ,o){
  o=o||{};
  const reserve=o.reserve===undefined?0.11:o.reserve, dMax=o.dMax||0.25;
  let cx=x0+R(0.004,0.012), guard=0;
  let last=null; // right face / height / depth / z of the last standing book
  while(cx<x1-reserve-0.02 && guard++<60){
    const st=pick(STYLE_WEIGHTED), df=st.def, spine=pick(st.spines);
    const n=rnd()<0.45?(3+Math.floor(rnd()*5)):(1+Math.floor(rnd()*2));
    const h0=Math.min(clear-0.03,R(df.h[0],df.h[1])*(o.hScale||1));
    const t0=R(df.t[0],df.t[1]), d0=Math.min(dMax,R(0.15,0.25));
    for(let i=0;i<n;i++){
      const t=t0*(n>1?R(0.95,1.05):R(0.85,1.15));
      if(cx+t>x1-reserve) break;
      const h=h0+(n>1?R(-0.002,0.002):R(-0.02,0.02));
      const b=makeBook(st,spine,t,h,d0);
      const pull=rnd()<0.1?R(0.015,0.04):R(-0.004,0.004);
      b.position.set(cx+t/2,y+h/2,frontZ-0.03-d0/2+pull);
      b.rotation.y=R(-0.006,0.006);
      booksG.add(b);
      last={x:cx+t,h:h,d:d0,z:b.position.z};
      cx+=t+R(0.0005,0.003);
    }
    if(rnd()<0.06) cx+=R(0.015,0.04);
  }
  // A leaning book rests on the LAST STANDING BOOK: its bottom-left corner sits on the shelf,
  // its top-left corner touches the neighbour's right face, and it tips toward the left.
  if(!o.noLean && last){
    const st=pick(STYLE_WEIGHTED), spine=pick(st.spines);
    const t=R(0.022,0.038);
    const h=Math.min(clear-0.03,R(0.2,0.3),last.h-0.015);
    const avail=x1-0.002-last.x;
    if(h>0.12){
      for(const a of [0.3,0.25,0.2,0.16,0.12]){
        const need=h*Math.sin(a)+0.001+t*Math.cos(a);
        if(need<=avail && h*Math.cos(a)<=last.h-0.008){
          const grp=new THREE.Group();
          grp.position.set(last.x+h*Math.sin(a)+0.001,y,last.z);
          grp.rotation.z=a;
          const b=makeBook(st,spine,t,h,last.d); b.position.set(t/2,h/2,0); grp.add(b); booksG.add(grp);
          break;
        }
      }
    }
  }
}

  g.font=`500 ${fs}px ${FONT}`; g.textAlign='center'; g.textBaseline='middle';
  [...text].forEach((ch,i)=>{
    const col=Math.floor(i/per), row=i%per;
    if(col>=cols) return;
    const cx=w-mx-cw*(col+0.5), cy=my+step*(row+0.5), pu='、。'.indexOf(ch)>=0;
    g.fillStyle=`rgba(32,24,18,${R(.78,.92).toFixed(2)})`;

  if(shade==='left'){ const gr=g.createLinearGradient(w*188/211,0,w,0); gr.addColorStop(0,'rgba(16,11,7,0)'); gr.addColorStop(1,'rgba(16,11,7,.31)'); g.fillStyle=gr; g.fillRect(w*188/211,0,w*23/211,h); }
  if(shade==='right'){ const gr=g.createLinearGradient(0,0,w*10/211,0); gr.addColorStop(0,'rgba(16,11,7,.4)'); gr.addColorStop(1,'rgba(16,11,7,0)'); g.fillStyle=gr; g.fillRect(0,0,w*10/211,h); }
}

function cordParts(T,H,D,kx){

//  * opening: the 3 upper bodies swing 178deg about x=211 and then sit 4px to the left;
//    the strips do NOT move sideways, they only turn over in place. Depths: cover 9->1, page1 5->5, page2 1->9.
//  * left page = the body of leaf 3 (depth -3). The book slides 107px to the left when open.

  wa.grp.updateWorldMatrix(true,false); wa.grp.getWorldPosition(SC.start);

const _tmp=new THREE.Vector3();
function updateShowcase(dt,time){
  if(!SC.rig) return;
  const sp=SC.goal>SC.u?0.95:1.25;
  SC.u+=clamp(SC.goal-SC.u,-dt*sp,dt*sp);
  const u=SC.u, a=ease(clamp(u,0,1)), rr=ease(clamp((u-0.3)/0.7,0,1));
  const yaw=lerp(0,Math.PI/2+SC.th,rr);                                     // one direct turn about the vertical axis: the front cover comes straight to the camera
  const v=clamp(u-1,0,1), open=ease(v), sc=lerp(1,SC.scale,a);
  scRoot.position.copy(SC.start).lerp(SC.P,a);
  scRoot.position.x=lerp(SC.start.x,SC.P.x,ease(clamp((u-0.3)/0.7,0,1)));   // slide sideways only after the book has cleared the cabinet
  scRoot.position.y+=Math.sin(time*1.6)*0.006*a;
  scRoot.position.addScaledVector(SC.right,-(107*PXM*SC.kx*sc)*open);         // original: the opened book slides 107px to the left
  scRoot.rotation.y=yaw; scRoot.scale.setScalar(sc);
  SC.rig.bodies.forEach(B=>{
    const e=ease(clamp((v-B.dly)/0.75,0,1));
    B.g.rotation.y=Math.PI*178/180*e;                                          // rotateY(178deg) about x=211 (the cord plane)
    B.g.position.x=lerp(B.x0,B.x1,e);
    B.g.position.z=B.z0-4*PXM*SC.kx*e;                                         // translateX(-4px)
    B.m.scale.x=lerp(1,0.5,e);                                                 // the flipped pages get half as thick
  });

  SC.rig.frontCords.visible=v<0.02;
  const kc=ease(clamp(v/0.4,0,1));
  SC.rig.tb.g.scale.x=lerp(1,SC.rig.tb.k,kc); SC.rig.wr.g.scale.x=lerp(1,SC.rig.wr.k,kc);

    while(scRoot.children.length) scRoot.remove(scRoot.children[0]);

/* ---------- hidden puzzle: 5 quick taps on the tatami in front of the shelf ---------- */
// Nothing about the floor is touched until the puzzle actually triggers, so there is nothing to look
// wrong or flicker beforehand: an invisible "catcher" plane (raycastable, never drawn) sits over the
// tatami area in front of the cabinet and only counts taps. On the 5th tap (within TRAP_TAP_WINDOW ms
// of the last) the real tile at that spot on the tatami grid is hidden and swapped, in the same
// instant, for a matching tatami-textured flap that swings 90 degrees open on its far long edge
// (the edge nearest the shelf), lifting up and back like a real cellar hatch so it clears the
// opening entirely, revealing a wooden staircase (the cabinet's own wood texture) that descends
// from one of the opening's short edges into darkness. The underground room itself isn't built yet,
// so the stairs simply fade to black; extend `stairs` (built inside openTrap()) here once that space
// exists.

function hitStairsOpening(ray){
  if(!stairsOpening) return false;
  const t=(stairsOpening.y-ray.origin.y)/ray.direction.y;
  if(!(t>0)) return false;
  const x=ray.origin.x+ray.direction.x*t, z=ray.origin.z+ray.direction.z*t;
  return x>=stairsOpening.xMin&&x<=stairsOpening.xMax&&z>=stairsOpening.zMin&&z<=stairsOpening.zMax;

let TRAP_X_G=0, TRAP_W_G=1.8, TRAP_ZF_G=0.9, TRAP_ZN_G=1.8;    // the tile's grid position, kept for descendStairs() to aim at
const STAIR_G={};                                              // lastTreadFarX/doorX/doorY/landW, filled in by openTrap()

trapCatcher.rotation.x=-Math.PI/2; trapCatcher.position.set(0,0.002,1.4);
scene.add(trapCatcher); pickables.push(trapCatcher);

function toggleFlap(){ trap.opened=!trap.opened; trap.goal=trap.opened?1:0; }
function isDescendant(o,anc){ if(!anc) return false; while(o){ if(o===anc) return true; o=o.parent; } return false; }

// Rather than jumping straight to a fixed viewpoint, the target itself glides down the slope over

// changes, and the target moves in a straight line down the stairs, the camera keeps exactly the
// same distance from the stair surface throughout, which reads as smoothly walking down them.
let stairsRide=null;
function descendStairs(){
  if(!trap.opened||stairsRide) return;
  const run=0.24, rise=0.19, START_STEP=3, z=(TRAP_ZF_G+TRAP_ZN_G)/2, x0=TRAP_X_G+TRAP_W_G/2-0.14;
  goal.theta=Math.PI/2; goal.phi=0.71; goal.r=3.0; setAuto(false);
  // Two phases: first (0..SPLIT) is exactly the original tread-following glide -- phi fixed, target
  // following the tread line down to the landing -- unchanged from what already worked. Only the
  // last stretch (SPLIT..1) swings the aim point over to the door's own centre and eases phi down to
  // exactly level, so the door ends up centred and faced dead-on right at the very end, without
  // disturbing the well-tuned descent that came before it. STAIR_G.* are LOCAL to the stairs group,
  // so x0 (the group's own world position) is added back in to get real world coordinates.
  const sx=x0-run*START_STEP, sy=-0.07-rise*START_STEP;
  const mx=x0+(STAIR_G.lastTreadFarX+STAIR_G.doorX)/2, my=STAIR_G.doorY;
  const ex=x0+STAIR_G.doorX, ey=STAIR_G.doorY+STAIR_G.doorH/2;
  // Levelling off at the SAME r=3.0 would swing the camera ~3m back up the corridor while it's
  // still at floor height -- and the corridor (unlike the landing) is filled by the actual sloped
  // treads there, which is exactly the "sinks into the stairs" collision. So r eases down to 0.8
  // over the same final stretch: by the time the view is level (phi=PI/2), the camera has pulled
  // in close enough to stay within the landing itself, clear of every tread.
  stairsRide={t:0,duration:5.5,split:0.78,sx,sy,mx,my,ex,ey,z,phi0:0.71,phi1:Math.PI/2,r0:3.0,r1:1.6};
}
function tapTrap(){
  if(trap.revealed) return;
  const now=performance.now();
  if(now-trap.last>TRAP_TAP_WINDOW) trap.taps=0;
  trap.taps++; trap.last=now;
  if(trap.taps>=5){ trap.revealed=true; openTrap(); }
}

/* ---------- hidden compartment: the centre back panel hides the shiori key ---------- */
// NOTE: the cabinet sits flush against the back wall, so there's no literal walk-in room modelled
// behind it. As a stand-in for "hidden behind the cabinet", the centre panel behind the shoji doors
// slides forward (the same sliding-panel mechanism as the doors and drawers) to reveal a shallow
// compartment with the shiori sitting in it. A real room back there would be a good follow-up.
let shiori=null;
makeMovable(centerBackPanel,'z',0.05,'secret-panel');
{
  const shioriMat=std({color:C('#7a2f3a'),roughness:0.7},0.3);
  shiori=new THREE.Group(); shiori.position.set(0,1.55,0.008); shelf.add(shiori);  // tucked in the 14mm gap behind the closed panel, so it doesn't clip through it
  box(0.03,0.16,0.004,shioriMat,0,0,0,shiori);
  box(0.03,0.01,0.004,matGold,0,0.075,0.002,shiori);
  const tassel=new THREE.Mesh(new THREE.ConeGeometry(0.012,0.03,8),matGold);
  tassel.castShadow=true; tassel.position.set(0,-0.095,0); shiori.add(tassel);
  pickables.push(shiori);
}
function collectShiori(){
  if(hasKey||!shiori) return;
  hasKey=true; shiori.visible=false;
  const idx=pickables.indexOf(shiori); if(idx>=0) pickables.splice(idx,1);
}

/* ---------- hidden doorway + second room, behind where the shelf slides away from ---------- */
// Nothing here is built until the shelf is actually opened for the first time (see
// buildInnerRoom(), called from tapHandle()) -- exactly like the tatami trapdoor -- so there is
// nothing for the camera to peek at behind or around the shelf before that happens.
const WALL_T=0.15;
const doorW=0.75, doorH=1.9, doorX0=-1.3, doorX1=doorX0+doorW;   // sits within the strip the shelf uncovers once slid open
let innerRoomBuilt=false;
function buildInnerRoom(){
  if(innerRoomBuilt) return; innerRoomBuilt=true;
  try{
    scene.remove(backWall); backWall.geometry.dispose();
    // Same material and same shadow behaviour as the original single plane (matWallA, receiveShadow
    // only, never castShadow) -- so cutting the doorway changes nothing about how this wall is lit;
    // only the doorway opening itself is new.
    const leftW=doorX0+ROOM_W/2, rightW=ROOM_W/2-doorX1;
    const wSeg1=box(leftW,ROOM_H,WALL_T,matWallA,(-ROOM_W/2+doorX0)/2,ROOM_H/2,-WALL_T/2,scene);
    const wSeg2=box(rightW,ROOM_H,WALL_T,matWallA,(doorX1+ROOM_W/2)/2,ROOM_H/2,-WALL_T/2,scene);
    const wSeg3=box(doorW,ROOM_H-doorH,WALL_T,matWallA,(doorX0+doorX1)/2,(doorH+ROOM_H)/2,-WALL_T/2,scene);
    [wSeg1,wSeg2,wSeg3].forEach(m=>{ m.castShadow=false; m.receiveShadow=true; });
    // thin dark-wood trim around the opening, mounted on the front face
    box(0.04,doorH+0.04,0.03,matDark,doorX0-0.02,doorH/2,0.02,scene);
    box(0.04,doorH+0.04,0.03,matDark,doorX1+0.02,doorH/2,0.02,scene);
    box(doorW+0.08,0.04,0.03,matDark,(doorX0+doorX1)/2,doorH+0.02,0.02,scene);
    // narrow the tokonoma-style alcove patch so it no longer overlaps the new opening
    alcove.geometry.dispose(); alcove.geometry=new THREE.PlaneGeometry(1.54-doorX1,ROOM_H);
    alcove.position.x=(doorX1+1.54)/2;
    // a fusuma panel across the opening, sliding sideways to reveal the room beyond
    const newDoor=fusumaDoor(doorW,doorH);
    newDoor.position.set((doorX0+doorX1)/2,doorH/2,0.03); scene.add(newDoor);
    makeMovable(newDoor,'x',doorW+0.02,'inner-door');
    // the second room itself -- floor, three walls and a ceiling, starting WALL_T beyond the back wall
    const ROOM2_W=3.0, ROOM2_D=3.0, z0=-WALL_T, z1=-WALL_T-ROOM2_D, zc=(z0+z1)/2;
    const floor2=new THREE.Mesh(new THREE.PlaneGeometry(ROOM2_W,ROOM2_D),matTatami);
    floor2.rotation.x=-Math.PI/2; floor2.position.set(0,0,zc); floor2.receiveShadow=true; scene.add(floor2);
    const ceil2=new THREE.Mesh(new THREE.PlaneGeometry(ROOM2_W,ROOM2_D),std({map:tDark,roughness:0.7},0.3));
    ceil2.rotation.x=Math.PI/2; ceil2.position.set(0,ROOM_H,zc); scene.add(ceil2);
    const farWall2=new THREE.Mesh(new THREE.PlaneGeometry(ROOM2_W,ROOM_H),matWallA);
    farWall2.position.set(0,ROOM_H/2,z1); farWall2.receiveShadow=true; scene.add(farWall2);
    for(const s of [-1,1]){
      const w2=new THREE.Mesh(new THREE.PlaneGeometry(ROOM2_D,ROOM_H),matWallA);
      w2.rotation.y=s<0?Math.PI/2:-Math.PI/2; w2.position.set(s*ROOM2_W/2,ROOM_H/2,zc); w2.receiveShadow=true; scene.add(w2);
    }
    TARGET_MIN.z=z1+0.15;   // let the camera pan into the room now that it actually exists
  }catch(err){ console.error('inner room: failed to build',err); }
}

/* ---------- buttons ---------- */
$('bDay').addEventListener('click',()=>{
  modeGoal=modeGoal?0:1; $('bDay').textContent=modeGoal?'昼にする':'夜にする'; $('bDay').classList.toggle('on',!!modeGoal);
});
const shojiMvs=movables.filter(m=>m.tag==='shoji');
function setShoji(open){
  shojiMvs.forEach(m=>{ m.goal=open?1:0; });
}
$('bReset').addEventListener('click',()=>{
  goal.theta=home.theta; goal.phi=home.phi; goal.r=home.r; goal.target.copy(home.target); setAuto(false);
});
setTimeout(()=>{ $('hint').style.opacity='0'; },14000);

/* ---------- loop ---------- */
const clock=new THREE.Clock(); let first=true;
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05), time=clock.elapsedTime;
  for(const m of movables){
    if(Math.abs(m.goal-m.t)>0.0004){ m.t+=(m.goal-m.t)*(1-Math.exp(-dt*7)); m.obj.position[m.axis]=m.base+m.delta*m.t; }
  }
  if(autoRotate) goal.theta=Math.sin(time*0.22)*0.6;
  if(trapHinge&&Math.abs(trap.goal-trap.t)>0.0004){ trap.t+=(trap.goal-trap.t)*(1-Math.exp(-dt*1.6)); trapHinge.rotation.x=-(Math.PI/2)*ease(clamp(trap.t,0,1)); }
  if(stairsRide){
    const R=stairsRide; R.t=Math.min(1,R.t+dt/R.duration);
    if(R.t<=R.split){
      const f=ease(R.t/R.split);
      goal.target.set(lerp(R.sx,R.mx,f),lerp(R.sy,R.my,f),R.z); goal.phi=R.phi0; goal.r=R.r0;
    }else{
      const f=ease((R.t-R.split)/(1-R.split));
      goal.target.set(lerp(R.mx,R.ex,f),lerp(R.my,R.ey,f),R.z); goal.phi=lerp(R.phi0,R.phi1,f); goal.r=lerp(R.r0,R.r1,f);
    }
    if(R.t>=1) stairsRide=null;
  }
  if(stairDoor&&Math.abs(stairDoor.goal-stairDoor.t)>0.0004){ stairDoor.t+=(stairDoor.goal-stairDoor.t)*(1-Math.exp(-dt*1.8)); stairDoor.hinge.rotation.y=-Math.PI*0.72*ease(clamp(stairDoor.t,0,1)); }
  if(scrollCurl&&Math.abs(scrollSwing.goal-scrollSwing.t)>0.0004){ scrollSwing.t+=(scrollSwing.goal-scrollSwing.t)*(1-Math.exp(-dt*3)); updateScrollCurl(scrollCurl.maxAngle*ease(clamp(scrollSwing.t,0,1))); }
  if(handleGroup&&Math.abs(handleSpin.target-handleSpin.angle)>0.001){ handleSpin.angle+=(handleSpin.target-handleSpin.angle)*(1-Math.exp(-dt*2.2)); handleGroup.rotation.z=handleSpin.angle; }
  if(Math.abs(shelfSlide.goal-shelfSlide.t)>0.0004){ shelfSlide.t+=(shelfSlide.goal-shelfSlide.t)*(1-Math.exp(-dt*2)); shelf.position.x=SHELF_SLIDE_DIST*ease(clamp(shelfSlide.t,0,1)); }
  const k=1-Math.exp(-dt*6);
  cur.theta+=(goal.theta-cur.theta)*k; cur.phi+=(goal.phi-cur.phi)*k; cur.r+=(goal.r-cur.r)*k; cur.target.lerp(goal.target,k);
  const sp=Math.sin(cur.phi);
  camera.position.set(cur.target.x+cur.r*sp*Math.sin(cur.theta),cur.target.y+cur.r*Math.cos(cur.phi),cur.target.z+cur.r*sp*Math.cos(cur.theta));
  camera.lookAt(cur.target);
  if(Math.abs(modeGoal-mode)>0.0005){ mode+=(modeGoal-mode)*(1-Math.exp(-dt*3)); applyMode(mode); }
  lampLight.intensity=lampBase*(1+0.04*Math.sin(time*7.3)*Math.sin(time*2.1));
  updateShowcase(dt,time);
  renderer.render(scene,camera);
  if(first){ first=false; loadingEl.style.opacity='0'; setTimeout(()=>loadingEl.remove(),1000); }
}
tick();
})();
</script>
