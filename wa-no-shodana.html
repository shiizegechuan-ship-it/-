<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>和の書棚 ― 書院造の書斎 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&display=swap">
<style>
:root{
  --bg:#120e0b; --panel:rgba(22,15,10,.66); --panel-hover:rgba(64,42,22,.82);
  --line:rgba(214,176,98,.55); --ink:#f1e6cf; --muted:#cdbd93; --seal:#a8281f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0d0a08; --panel:rgba(18,12,8,.7); }
}
:root[data-theme="dark"]{ --bg:#0d0a08; --panel:rgba(18,12,8,.7); }
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--ink);
  font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;}
#app{position:fixed;inset:0;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#app:active{cursor:grabbing}
canvas{display:block}
.hud{position:fixed;inset:0;pointer-events:none}
.title{position:absolute;left:20px;top:18px;display:flex;gap:12px;align-items:center;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.seal{width:38px;height:38px;background:var(--seal);color:#f6e9d0;display:grid;place-items:center;
  font-weight:700;font-size:21px;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.5), inset 0 0 0 1.5px rgba(246,233,208,.35)}
.title b{display:block;font-size:19px;letter-spacing:.3em;font-weight:700}
.title small{display:block;margin-top:3px;font-size:11px;letter-spacing:.16em;color:var(--muted)}
.hint{position:absolute;left:20px;top:70px;max-width:min(80vw,440px);font-size:12px;line-height:1.9;letter-spacing:.1em;
  color:var(--muted);text-shadow:0 1px 4px #000;transition:opacity 1.6s}
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:auto;padding:0 12px;width:max-content;max-width:100%;box-sizing:border-box}
.bar button{font:inherit;font-size:13px;letter-spacing:.14em;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);padding:9px 16px;border-radius:2px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.bar button:hover{background:var(--panel-hover)}
.bar button:focus-visible{outline:2px solid #e8c878;outline-offset:2px}
.bar button[hidden]{display:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);
  letter-spacing:.45em;font-size:14px;transition:opacity .9s;z-index:5}
@media (prefers-reduced-motion: reduce){ #loading,.hint{transition:none} }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <div class="title"><div class="seal">書</div><div><b>和の書棚</b><small>書院造 ― 違い棚と障子の書斎</small></div></div>
  <div class="hint" id="hint">ドラッグで見回す ／ ホイール・ピンチで寄る<br>障子・戸・引き出しをクリックで開閉 ／ 障子を開くと、中の和綴じの本をクリックで取り出せます<br>ダブルクリックでその場所へ</div>
  <div class="bar">
    <button id="bReset" type="button">位置をリセット</button>
    <button id="bExit" type="button" hidden>部屋を出る</button>
  </div>
</div>
<div id="loading">読み込み中</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
'use strict';
/* =====================================================================================
   ARCHITECTURE MAP — read this first before editing.
   One IIFE, top-to-bottom in this order:
     1. utils            small helpers: seeded rnd(), pick/clamp/lerp, C() (sRGB color)
     2. renderer / env   THREE.WebGLRenderer, camera, scene, buildEnv() reflection probe
     3. textures         canvasTex() draws a <canvas> and wraps it as a THREE texture;
                          each drawX(ctx,w,h,...) function procedurally paints one surface
                          (wood/paper/plaster/tatami/fusuma/makie/spines/scroll)
     4. materials        std() = MeshStandardMaterial/PhysicalMaterial + shared envMap;
                          matDark/matMid/matLight = wood, matLacquer/matGold = trim,
                          matPaper/matWashi = shoji & panel paper
     5. geometry helpers  box()/lathe()/mapBoxUV() build+UV-map meshes onto `shelf`
     6. room              walls, tatami floor, shoji window, hanging scroll
     7. shelf structure   the cabinet frame, shelves, doors, drawers (see "movables" below)
     8. books             fillShelf() fills a shelf run with generated paperback/hardback
                          spines; STYLE_DEFS/STYLES define the look of ordinary books
     9. 和綴之書 (wabon)   the 27 user-supplied stitched-bound books (3 sizes x 9 covers).
                          WA_* constants hold their config; placeWabonRow() lays them out
                          on the centre shelf; buildRig()/openShowcase()/updateShowcase()
                          drive the "float out, turn, open" animation (see below)
    10. andon lamp        the standing paper lamp on the right
    11. lights            sun/hemi/fill + applyMode() cross-fades day <-> night
    12. camera rig        orbit state (cur/goal), pointer + wheel handlers, dbl-click zoom
    13. buttons           day/night, shoji, drawers, auto-rotate, reset — wire up the HUD
    14. render loop        tick(): advances movables, camera, mode, showcase, then renders

   Two animation systems, don't confuse them:
     - "movables": doors/drawers/shoji. makeMovable(obj,axis,delta,tag) registers a mesh;
       tick() lerps mv.t toward mv.goal (0..1) each frame. findMv() walks up from a
       raycast hit to find the owning entry. Tag is used only to group buttons/taps
       ('shoji' toggles both leaves together; 'lower'/'tenbukuro' are per-pair).
     - "showcase" (SC): exactly one wabon book at a time. openShowcase(wa) builds a
       throwaway high-detail rig (buildRig) parented under scRoot, animates it through
       u = 0..2 (0-1 float+turn, 1-2 page-open) in updateShowcase(), and at u=0 on the
       way back it restores the shelf copy's visibility and frees the rig's geometry.

   Adding a new wabon cover colour: append to WA_COLORS (hex + title ink colour) —
   placeWabonRow()/buildRig() pick it up automatically, no other change needed.
   Adding a new plain book title: append [title, author] to TITLES near the top.

   Hidden puzzle (search "hidden puzzle" near the buttons section): an invisible catcher plane over
   the tatami in front of the shelf counts 5 taps (`trap`/tapTrap()), then openTrap() hides the real
   tile on that spot of the tatami grid (`tatamiInst`) and builds the flap/pit/stairs/door for the
   first time — nothing is built or touched before that, so there's nothing to see or flicker.
   After that first build, tapping the flap itself toggles it open/closed in one tap (toggleFlap()),
   and tapping down into the open hole (`stairsCatcherRef`) plays a scripted camera move down the
   stairs (descendStairs()). The stairs end at a locked door (`stairDoor`); tapping it shakes if
   `hasKey` is false, or swings it open once true. `hasKey` becomes true via collectShiori(), when
   the shiori tucked behind the cabinet's centre panel (`shiori`, revealed by sliding that panel —
   it's `makeMovable`'d like the doors/drawers, tag 'secret-panel') is tapped. There is no literal
   room modelled beyond the locked door yet — it simply fades to black.

   Hidden room (search "the room behind the fusuma"): tapping the handle behind the scroll slides the
   shelf aside and, the first time, buildInnerRoom() cuts a doorway with a fusuma into the back wall and
   buildInnerInterior() furnishes the room beyond it (8.4 x 6 m). That room lives in its own scene
   (`innerScene`) with its own lights, drawn after the main scene into the same depth buffer and only
   while the fusuma is open; applyMode() forwards day/night to it via `innerMode`. Tapping the fusuma
   glides the camera in (roomRide) and then lets it look all the way round from one spot (roomView);
   部屋を出る / 位置をリセット back it out again (enterInnerRoom()/exitInnerRoom()).
   The stairwell under the trapdoor likewise has its own scene (`underScene`), lights and material
   copies; decorateStairwell() fits out its side walls, ceiling and the wall around the locked door,
   and buildHeavyDoor() builds that door (any part of it -- studs, ring, straps -- counts as a tap).
   Inside the hidden room, taps go to buildInnerInterior()'s own pick(), which raycasts that room's
   scene only (never `pickables`, so no main-room book can fire from in there); tappable things carry
   userData.innerAct -- see movable() there for drawers/doors/scroll/art/shoji/chairs, and the lamp
   switches. Add a new puzzle prop by giving any object in that room a userData.innerAct function.

   Camera (search "camera rig"): goal.target can be panned with two fingers and zoomed with a pinch
   or the wheel toward the real point under the cursor/pinch midpoint (zoomToward()/panBy()), but any
   user-driven pan is clamped to TARGET_MIN/TARGET_MAX (clampTarget()) so it can't wander into
   unbuilt parts of the room. Scripted camera moves (dblclick, the home reset, descendStairs()) set
   goal.target directly and intentionally skip that clamp.
   ===================================================================================== */
const loadingEl=document.getElementById('loading');
if(!window.THREE){ loadingEl.textContent='three.js を読み込めませんでした'; return; }

const FONT='"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif';
const TITLES=[
 ['源氏物語','紫式部'],['枕草子','清少納言'],['徒然草','兼好'],['方丈記','長明'],['万葉集',''],['古今和歌集',''],
 ['平家物語',''],['奥の細道','芭蕉'],['雨月物語','秋成'],['竹取物語',''],['伊勢物語',''],['土佐日記','貫之'],
 ['更級日記',''],['今昔物語集',''],['古事記',''],['日本書紀',''],['風姿花伝','世阿弥'],['五輪書','武蔵'],
 ['葉隠',''],['茶の本','天心'],['陰翳礼讃','谷崎'],['吾輩は猫である','漱石'],['坊っちゃん','漱石'],['こころ','漱石'],
 ['草枕','漱石'],['三四郎','漱石'],['夢十夜','漱石'],['舞姫','鷗外'],['五重塔','露伴'],['雪国','川端'],
 ['伊豆の踊子','川端'],['羅生門','芥川'],['蜘蛛の糸','芥川'],['走れメロス','太宰'],['斜陽','太宰'],['銀河鉄道の夜','賢治'],
 ['風の又三郎','賢治'],['山月記','中島'],['檸檬','梶井'],['細雪','谷崎'],['浮雲','四迷'],['たけくらべ','一葉'],
 ['遠野物語','柳田'],['学問のすゝめ','諭吉'],['蕪村句集',''],['一茶句集',''],['花伝書',''],['歎異抄',''],
 ['禅と日本文化','鈴木'],['武士道','新渡戸'],['日本の面影','八雲'],['山家集','西行']
];
try{
  const chars=TITLES.map(t=>t[0]+t[1]).join('')+'書雅和松梅綴之鴛照眛琉';
  await Promise.race([
    Promise.all([document.fonts.load('700 40px "Noto Serif JP"',chars),document.fonts.load('500 40px "Noto Serif JP"',chars)]),
    new Promise(r=>setTimeout(r,4000))
  ]);
}catch(e){}

/* ---------- utils ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(20260919);
const R=(a,b)=>a+(b-a)*rnd();
const pick=arr=>arr[Math.floor(rnd()*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const C=hex=>new THREE.Color(hex).convertSRGBToLinear();

/* ---------- renderer ---------- */
const host=document.getElementById('app');
let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
}catch(e){ loadingEl.textContent='WebGL を利用できません'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
host.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d0a08);
const camera=new THREE.PerspectiveCamera(38,1,0.05,60);
const maxAniso=renderer.capabilities.getMaxAnisotropy();

/* ---------- environment (reflections) ---------- */
function buildEnv(){
  const es=new THREE.Scene();
  const sg=new THREE.SphereGeometry(20,32,16);
  const p=sg.attributes.position, cols=new Float32Array(p.count*3);
  const top=[0.20,0.16,0.12], hor=[0.50,0.38,0.27], bot=[0.22,0.22,0.10];
  for(let i=0;i<p.count;i++){
    const y=p.getY(i)/20, a=y>=0?top:bot, k=Math.pow(Math.abs(y),0.7);
    cols[i*3]=hor[0]+(a[0]-hor[0])*k; cols[i*3+1]=hor[1]+(a[1]-hor[1])*k; cols[i*3+2]=hor[2]+(a[2]-hor[2])*k;
  }
  sg.setAttribute('color',new THREE.BufferAttribute(cols,3));
  es.add(new THREE.Mesh(sg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  const win=(w,h,pos,c)=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c[0],c[1],c[2]),side:THREE.DoubleSide}));
    m.position.set(pos[0],pos[1],pos[2]); m.lookAt(0,1,0); es.add(m);
  };
  win(10,6,[-14,6,8],[6,5.4,4.4]);
  win(14,4,[10,10,14],[2.4,2.3,2.2]);
  win(20,10,[0,14,0],[0.9,0.85,0.75]);
  const pm=new THREE.PMREMGenerator(renderer);
  const rt=pm.fromScene(es,0.03);
  pm.dispose();
  return rt.texture;
}
const envTex=buildEnv();

/* ---------- textures ---------- */
function canvasTex(w,h,draw,o){
  o=o||{};
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c);
  t.encoding=THREE.sRGBEncoding;
  if(o.repeat!==false){ t.wrapS=t.wrapT=THREE.RepeatWrapping; }
  t.anisotropy=maxAniso;
  return t;
}
function wrapped(w,h,fn){ for(const dx of [-w,0,w]) for(const dy of [-h,0,h]) fn(dx,dy); }

function drawWood(g,w,h,o){
  g.fillStyle=o.base; g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){
    const y=rnd()*h, th=R(6,60), a=R(0.04,0.14), col=rnd()<0.55?o.dark:o.light;
    for(const off of [-h,0,h]){
      const grd=g.createLinearGradient(0,y+off-th,0,y+off+th);
      grd.addColorStop(0,`rgba(${col},0)`); grd.addColorStop(0.5,`rgba(${col},${a})`); grd.addColorStop(1,`rgba(${col},0)`);
      g.fillStyle=grd; g.fillRect(0,y+off-th,w,th*2);
    }
  }
  g.lineCap='round';
  const n=o.lines*5;
  for(let i=0;i<n;i++){
    const y0=rnd()*h, col=rnd()<0.62?o.dark:o.light;
    g.strokeStyle=`rgba(${col},${R(0.05,0.28)})`;
    g.lineWidth=R(0.4,1.8);
    const amp=R(0.4,5)*o.wave, k=1+Math.floor(rnd()*4), ph=rnd()*6.283;
    for(const off of [-h,0,h]){
      g.beginPath();
      for(let x=0;x<=w;x+=16){
        const y=y0+off+Math.sin(x/w*6.283*k+ph)*amp;
        if(x===0)g.moveTo(x,y); else g.lineTo(x,y);
      }
      g.stroke();
    }
  }
  for(let i=0;i<2200;i++){
    g.fillStyle=`rgba(${o.dark},${R(0.05,0.2)})`;
    g.fillRect(rnd()*w,rnd()*h,R(2,9),R(0.5,1.2));
  }
}
function drawPaper(g,w,h,o){
  g.fillStyle=o.base; g.fillRect(0,0,w,h);
  for(let i=0;i<40;i++){
    const x=rnd()*w,y=rnd()*h,r=R(30,110);
    wrapped(w,h,(dx,dy)=>{
      const gr=g.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,r);
      gr.addColorStop(0,`rgba(${rnd()<.5?'120,90,50':'255,255,255'},.05)`); gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr; g.fillRect(x+dx-r,y+dy-r,r*2,r*2);
    });
  }
  for(let i=0;i<o.fibers;i++){
    const x=rnd()*w,y=rnd()*h,l=R(6,30),a=rnd()*6.283;
    g.strokeStyle=rnd()<.5?`rgba(255,255,255,${R(.1,.35)})`:`rgba(120,90,50,${R(.03,.12)})`;
    g.lineWidth=R(.4,1.2);
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke();
  }
  if(o.gold){
    for(let i=0;i<o.gold;i++){
      const x=rnd()*w,y=rnd()*h,s=R(1.5,6);
      g.save(); g.translate(x,y); g.rotate(rnd()*3.14);
      g.fillStyle=`rgba(${215+rnd()*25|0},${170+rnd()*25|0},${80+rnd()*30|0},${R(.35,.85)})`;
      g.fillRect(0,0,s,s*R(.4,1)); g.restore();
    }
  }
}
function drawPlaster(g,w,h,base){
  g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let i=0;i<220;i++){
    const x=rnd()*w,y=rnd()*h,r=R(30,150),dark=rnd()<.5;
    wrapped(w,h,(dx,dy)=>{
      const gr=g.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,r);
      gr.addColorStop(0,dark?`rgba(40,28,15,${R(.05,.13)})`:`rgba(255,240,215,${R(.04,.10)})`); gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr; g.fillRect(x+dx-r,y+dy-r,r*2,r*2);
    });
  }
  for(let i=0;i<9000;i++){
    g.fillStyle=rnd()<.5?`rgba(30,20,10,${R(.05,.25)})`:`rgba(255,245,225,${R(.05,.22)})`;
    g.fillRect(rnd()*w,rnd()*h,R(1,2.6),R(1,2.6));
  }
}
function drawTatami(g,w,h){
  g.fillStyle='#a8a66a'; g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=2){
    g.fillStyle=`rgba(${rnd()<.5?'255,250,190':'70,70,30'},${R(.04,.16)})`; g.fillRect(0,y,w,1);
  }
  for(let i=0;i<600;i++){
    g.fillStyle=`rgba(${rnd()<.5?'255,250,190':'70,70,30'},${R(.05,.18)})`; g.fillRect(rnd()*w,rnd()*h,R(20,120),R(1,2));
  }
  for(let x=0;x<w;x+=10){ g.fillStyle='rgba(60,60,20,.05)'; g.fillRect(x,0,1,h); }
  const b=Math.round(h*0.045);
  for(const y0 of [0,h-b]){
    g.fillStyle='#1b1d27'; g.fillRect(0,y0,w,b);
    g.fillStyle='rgba(200,180,120,.18)'; g.fillRect(0,y0===0?b-3:y0,w,3);
    for(let x=0;x<w;x+=14){ g.fillStyle='rgba(255,255,255,.05)'; g.fillRect(x,y0+b*0.3,7,b*0.4); }
  }
  g.strokeStyle='rgba(40,40,10,.45)'; g.lineWidth=3; g.strokeRect(0,0,w,h);
}
function drawFusuma(g,w,h){
  const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'#1b2c48'); gr.addColorStop(1,'#0e1626');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  const s=32;
  for(let y=0;y<h;y+=s)for(let x=0;x<w;x+=s){ if(rnd()<0.10){ g.fillStyle=`rgba(214,172,84,${R(.05,.14)})`; g.fillRect(x+1,y+1,s-2,s-2);} }
  for(let band=0;band<5;band++){
    const cy=h*(0.14+band*0.19);
    const grd=g.createLinearGradient(0,cy-20,0,cy+20);
    grd.addColorStop(0,'rgba(240,206,120,0.95)'); grd.addColorStop(1,'rgba(176,132,52,0.85)');
    g.fillStyle=grd;
    for(let k=0;k<9;k++){
      g.beginPath(); g.ellipse((k+R(-.2,.2))*w/8,cy+R(-5,5),R(46,95),R(9,16),0,0,6.283); g.fill();
    }
    for(let k=0;k<160;k++){ g.fillStyle=`rgba(240,210,130,${R(.2,.7)})`; g.fillRect(rnd()*w,cy+R(-6,32),R(1,2.6),R(1,2.6)); }
  }
}
function drawMakie(g,w,h){
  g.fillStyle='#120d0a'; g.fillRect(0,0,w,h);
  for(let i=0;i<7000;i++){
    const x=rnd()*w,y=rnd()*h,dens=Math.pow(y/h,1.6);
    if(rnd()>0.15+dens*0.85) continue;
    g.fillStyle=`rgba(${210+rnd()*30|0},${165+rnd()*30|0},${70+rnd()*30|0},${R(.15,.8)})`;
    const s=R(.6,2.4); g.fillRect(x,y,s,s);
  }
  for(let b=0;b<4;b++){
    const y=h*(.5+b*.14), gr=g.createLinearGradient(0,y-30,0,y+30);
    gr.addColorStop(0,'rgba(200,150,60,0)'); gr.addColorStop(.5,'rgba(200,150,60,.10)'); gr.addColorStop(1,'rgba(200,150,60,0)');
    g.fillStyle=gr; g.fillRect(0,y-30,w,60);
  }
}
function vtext(g,s,cx,y0,maxH,maxW,color,weight){
  const chars=[...s]; if(!chars.length) return;
  const size=Math.min(maxW,maxH/chars.length);
  g.font=`${weight} ${size}px ${FONT}`; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle=color;
  let y=y0+(maxH-size*chars.length)/2+size/2;
  for(const c of chars){ g.fillText(c,cx,y); y+=size; }
}

function mapBoxUV(g,w,h,d,S){
  const pos=g.attributes.position,nor=g.attributes.normal,uv=g.attributes.uv;
  const dims=[w,h,d]; let L=0; if(h>dims[L])L=1; if(d>dims[L])L=2;
  const off=[rnd()*10,rnd()*10];
  for(let i=0;i<pos.count;i++){
    const p=[pos.getX(i),pos.getY(i),pos.getZ(i)];
    const n=[Math.abs(nor.getX(i)),Math.abs(nor.getY(i)),Math.abs(nor.getZ(i))];
    const na=n[0]>0.5?0:(n[1]>0.5?1:2);
    const axes=[0,1,2].filter(a=>a!==na);
    let ua,va;
    if(axes.indexOf(L)>=0){ ua=L; va=axes.find(a=>a!==L); } else { ua=axes[0]; va=axes[1]; }
    uv.setXY(i,p[ua]/S+off[0],p[va]/S+off[1]);
  }
  uv.needsUpdate=true;
}

// Bends the scroll's front/back geometry into a soft paper curl, parameterized by total bend angle A
// (0 = flat/closed). Each vertex's rest position (x0,y0) — y0 running from 0 at the fixed top edge to
// -panelH at the free bottom edge — is mapped onto a circular arc of radius R=panelH/A, so that as A
// grows from 0 the sheet rolls up and away from the wall continuously (not as separate rigid segments,
// so there are no seams), and every point's arc-length from the top edge is preserved. The bottom rod
// is repositioned each frame to sit at the curled position of the free edge, extended slightly along
// its local tangent so it keeps its original small overhang.
function updateScrollCurl(A,sc){
  sc=sc||scrollCurl; if(!sc) return;
  const flat=A<1e-4;
  const R=flat?0:sc.panelH/A;
  const bend=(geo,base)=>{
    const pos=geo.attributes.position;
    if(flat){ pos.array.set(base); }
    else{
      for(let i=0;i<pos.count;i++){
        const x0=base[i*3], y0=base[i*3+1], s=-y0/sc.panelH, phi=s*A;
        pos.setXYZ(i,x0,-R*Math.sin(phi),R*(1-Math.cos(phi)));
      }
    }
    pos.needsUpdate=true; geo.computeVertexNormals();
  };
  bend(sc.frontGeo,sc.frontBase); bend(sc.backGeo,sc.backBase);
  const y1=flat?-sc.panelH:-R*Math.sin(A), z1=flat?0:R*(1-Math.cos(A));
  const tx=-Math.cos(A), tz=Math.sin(A);
  sc.bottomRod.position.set(0,y1+0.015*tx,z1+0.015*tz);
  sc.bottomRod.rotation.x=-A;
}
function box(w,h,d,mat,x,y,z,parent){
  const g=new THREE.BoxGeometry(w,h,d);
  if(mat.userData.woodUV) mapBoxUV(g,w,h,d,mat.userData.woodUV);
  const m=new THREE.Mesh(g,mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  (parent||shelf).add(m); return m;
}
function regroupBox(g,order,counts){
  const idx=g.index.array, out=new idx.constructor(idx.length); let o=0;
  for(const f of order){ for(let k=0;k<6;k++) out[o++]=idx[f*6+k]; }
  idx.set(out); g.index.needsUpdate=true; g.clearGroups();
  let s=0; counts.forEach((c,i)=>{ g.addGroup(s,c*6,i); s+=c*6; });
}

function fillShelf(x0,x1,y,clear,frontZ,o){
  o=o||{};
  const reserve=o.reserve===undefined?0.11:o.reserve, dMax=o.dMax||0.25;
  let cx=x0+R(0.004,0.012), guard=0;
  let last=null; // right face / height / depth / z of the last standing book
  while(cx<x1-reserve-0.02 && guard++<60){
    const st=pick(STYLE_WEIGHTED), df=st.def, spine=pick(st.spines);
    const n=rnd()<0.45?(3+Math.floor(rnd()*5)):(1+Math.floor(rnd()*2));
    const h0=Math.min(clear-0.03,R(df.h[0],df.h[1])*(o.hScale||1));
    const t0=R(df.t[0],df.t[1]), d0=Math.min(dMax,R(0.15,0.25));
    for(let i=0;i<n;i++){
      const t=t0*(n>1?R(0.95,1.05):R(0.85,1.15));
      if(cx+t>x1-reserve) break;
      const h=h0+(n>1?R(-0.002,0.002):R(-0.02,0.02));
      const b=makeBook(st,spine,t,h,d0);
      const pull=rnd()<0.1?R(0.015,0.04):R(-0.004,0.004);
      b.position.set(cx+t/2,y+h/2,frontZ-0.03-d0/2+pull);
      b.rotation.y=R(-0.006,0.006);
      booksG.add(b);
      last={x:cx+t,h:h,d:d0,z:b.position.z};
      cx+=t+R(0.0005,0.003);
    }
    if(rnd()<0.06) cx+=R(0.015,0.04);
  }
  // A leaning book rests on the LAST STANDING BOOK: its bottom-left corner sits on the shelf,
  // its top-left corner touches the neighbour's right face, and it tips toward the left.
  if(!o.noLean && last){
    const st=pick(STYLE_WEIGHTED), spine=pick(st.spines);
    const t=R(0.022,0.038);
    const h=Math.min(clear-0.03,R(0.2,0.3),last.h-0.015);
    const avail=x1-0.002-last.x;
    if(h>0.12){
      for(const a of [0.3,0.25,0.2,0.16,0.12]){
        const need=h*Math.sin(a)+0.001+t*Math.cos(a);
        if(need<=avail && h*Math.cos(a)<=last.h-0.008){
          const grp=new THREE.Group();
          grp.position.set(last.x+h*Math.sin(a)+0.001,y,last.z);
          grp.rotation.z=a;
          const b=makeBook(st,spine,t,h,last.d); b.position.set(t/2,h/2,0); grp.add(b); booksG.add(grp);
          break;
        }
      }
    }
  }
}

// Walls, ceiling and fittings for the stairwell (stairs-local coords: the stairs descend toward -x,
// the side walls stand at z=±halfW, the treads' nosing line is noseY(x)). Same idiom as the hidden
// room: plaster over a wood wainscot that follows the pitch, a closed stringer, dado rail, a handrail

function decorateStairwell(stairs,o){

  const xLand=(doorY+0.0475)/slope;                                   // where the nosing line meets the landing

  stairs.updateMatrixWorld(true);

  const matPl=std({map:tPl,bumpMap:tPl,bumpScale:0.7,roughness:0.96},0.2);

  const tWal=woodTex('#4a2c1a','20,10,5','138,90,54',60,0.8);
  const matWal=std({map:tWal,bumpMap:tWal,bumpScale:0.3,roughness:0.45,clearcoat:0.3,clearcoatRoughness:0.3},0.3,true); matWal.userData.woodUV=0.8;
  const matStr=std({map:tDark,color:C('#8a7a70'),roughness:0.5,side:THREE.DoubleSide},0.15);   // closed stringer: dark-stained wood

  const matSh=std({map:tPaper,emissive:C('#ffbe78'),emissiveMap:tPaper,emissiveIntensity:1.5,roughness:0.9,side:THREE.DoubleSide},0.05);
  const matCel=std({color:C('#8fb3a2'),roughness:0.18,clearcoat:0.6,clearcoatRoughness:0.1,side:THREE.DoubleSide},1.2,true);
  const matBk=std({color:C('#2b1e16'),roughness:0.9},0.3);

  const art=(fn,w,h)=>std({map:canvasTex(w,h,fn,{repeat:false}),roughness:0.8},0.15);

  // a band between two curves of x, as a flat shape in the x-y plane (sampled finely, plus its kinks)

    for(const x of [Math.min(-1.15,(-0.03-H+0.0475)/slope),doorX+0.45]){ const f=new THREE.Mesh(new THREE.SphereGeometry(0.027,16,12),matBr); f.position.set(x,noseY(x)+H,out); f.castShadow=true; side.add(f); }
  }
  // paper bracket lamps -- the stairwell's own light
  const sconce=(x,sz)=>{
    const y=noseY(x)+1.45;
    const g=new THREE.Group(); g.position.set(x,y,sz*(halfW-0.004)); g.rotation.y=sz>0?Math.PI:0; stairs.add(g);
    box(0.07,0.16,0.012,matBr,0,0,0.006,g);
    const arm=cyl(0.008,0.008,0.1,matBr,8); arm.rotation.x=Math.PI/2; arm.position.set(0,-0.02,0.06); g.add(arm);
    const sh=box(0.12,0.17,0.12,matSh,0,0,0.13,g); sh.castShadow=false;
    for(const cx of [-1,1])for(const cz of [-1,1]){ const p=box(0.012,0.19,0.012,matDarkU,cx*0.062,0,0.13+cz*0.062,g); p.castShadow=false; }
    box(0.14,0.012,0.14,matDarkU,0,0.095,0.13,g).castShadow=false; box(0.14,0.012,0.14,matDarkU,0,-0.095,0.13,g).castShadow=false;
    const L=new THREE.PointLight(0xffb870,0.95,2.8,2); L.position.set(0,0,0.13); g.add(L);
  };
  sconce(-2.3,-1); sconce(-3.55,1); sconce(-4.75,-1); sconce(-5.65,1);
  // framed prints
  const framed=(x,y,sz,w,h,mat)=>{
    const g=new THREE.Group(); g.position.set(x,y,sz*(halfW-0.004)); g.rotation.y=sz>0?Math.PI:0; stairs.add(g);
    const pic=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat); pic.position.z=0.012; pic.receiveShadow=true; g.add(pic);
    box(w+0.1,h+0.1,0.008,matMat,0,0,0.006,g);
    box(w+0.13,0.018,0.03,matDarkU,0,(h+0.11)/2,0.015,g); box(w+0.13,0.018,0.03,matDarkU,0,-(h+0.11)/2,0.015,g);
    box(0.018,h+0.13,0.03,matDarkU,-(w+0.11)/2,0,0.015,g); box(0.018,h+0.13,0.03,matDarkU,(w+0.11)/2,0,0.015,g);
  };
  framed(-2.05,noseY(-2.05)+1.25,1,0.26,0.32,matPine);
  framed(-3.3,noseY(-3.3)+1.3,-1,0.4,0.32,matWave);
  framed(-5.25,doorY+1.55,-1,0.3,0.38,matPine);
  // a floating walnut shelf on the landing, with a celadon vase and a camellia sprig
  {
    const g=new THREE.Group(); g.position.set(-4.85,doorY+1.18,halfW); g.rotation.y=Math.PI; stairs.add(g);
    box(0.62,0.035,0.17,matWal,0,0,0.085,g);
    for(const sx of [-1,1]) box(0.02,0.06,0.02,matBr,sx*0.24,-0.045,0.02,g);
    const v=lathe(VASE,matCel,40); v.scale.setScalar(0.62); v.position.set(-0.12,0.0175,0.085); g.add(v);
    const c=new THREE.CatmullRomCurve3([[-0.12,0.27,0.085],[-0.08,0.4,0.09],[0.02,0.5,0.1],[0.12,0.52,0.11]].map(p=>new THREE.Vector3(...p)));
    const br=new THREE.Mesh(new THREE.TubeGeometry(c,16,0.004,6),matBk); br.castShadow=true; g.add(br);
    const lg=new THREE.SphereGeometry(1,10,6);
    for(let i=0;i<6;i++){ const l=new THREE.Mesh(lg,matLf); l.scale.set(0.04,0.005,0.019); l.position.copy(c.getPoint(0.25+i*0.13)); l.rotation.set(R(-0.6,0.6),i*1.9,R(-0.4,0.4)); l.castShadow=true; g.add(l); }
    box(0.16,0.02,0.11,std({color:C('#3a2d24'),roughness:0.85},0.2),0.18,0.028,0.085,g);
  }
  // ceiling over the stairwell (beyond the opening), a header beam at the opening's edge, and the end walls
  battenCeiling(stairs,xEnd,openX0,-halfW,halfW,CEIL,matDarkU,false).castShadow=true;   // keeps the spill light to the opening
  box(0.1,0.14,halfW*2,matDarkU,openX0-0.05,CEIL-0.07,0,stairs);
  const endWall=(x,ry,y0,y1,z0,z1)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(z1-z0,y1-y0),matPl); m.position.set(x,(y0+y1)/2,(z0+z1)/2); m.rotation.y=ry; m.receiveShadow=true; stairs.add(m); stairs.updateMatrixWorld(true); worldUV(m,0,2.2,2.2); };
  endWall(xTop,-Math.PI/2,doorY-0.1,-0.002,-halfW,halfW);                                // behind the top step
  const dx=doorX-0.03, dTop=doorY+doorH, jw=o.w/2;

  const matCap=std({color:C('#8a6a3a'),metalness:1,roughness:0.32},0.6);

  box(0.14,0.03,o.w+0.4,matCase,doorX+0.07,dTop+0.185,0,stairs);
  for(const s of [-1,1]){ box(0.12,doorH,0.085,matCase,doorX+0.06,doorY+doorH/2,s*(jw+0.0425),stairs);

  box(0.15,0.02,o.w+0.17,std({color:C('#2b2927'),roughness:0.55},0.3),doorX+0.125,doorY+0.01,0,stairs);

function openTrap(){
  try{
    // snap onto the real tatami grid (the row just in front of the shelf, the column nearest centre)
    // so the flap that replaces it lines up with its neighbours exactly.
    const rows=Math.ceil(ROOM_D/0.9), cols=Math.ceil(ROOM_W/1.8)+1, ti=1;
    let bestK=0,bestX=Infinity;
    for(let k=0;k<cols;k++){ const x=-ROOM_W/2+0.9+1.8*k-(ti%2)*0.9; if(Math.abs(x)<Math.abs(bestX)){ bestX=x; bestK=k; } }
    const TRAP_X=bestX, TRAP_ZF=0.9*ti, TRAP_ZN=0.9*ti+0.9, TRAP_W=1.8, TRAP_D=0.9, TRAP_THICK=0.045;
    TRAP_X_G=TRAP_X; TRAP_W_G=TRAP_W; TRAP_ZF_G=TRAP_ZF; TRAP_ZN_G=TRAP_ZN;
    if(tatamiInst){                                             // remove the real tile this flap replaces
      tatamiInst.setMatrixAt(ti*cols+bestK,new THREE.Matrix4().makeScale(0,0,0));
      tatamiInst.instanceMatrix.needsUpdate=true;
    }
    const zF=TRAP_ZF, zN=TRAP_ZN;    // the tile's own front/back edges, still used to size the frame-free opening
    const z0=zF, z1=zN;
    const N=18, rise=0.19, run=0.24, w=TRAP_D-0.14;                                     // 18 steps: twice the original run
    // enters from a short edge of the opening (x, near TRAP_W/2) and descends along X, not along the
    // long edge the door hinges on -- width now spans the short (Z) dimension instead.
    // The whole stairwell lives in its own scene (underScene) with its own lights, drawn after the main
    // scene into the same depth buffer -- seen only through the opening in the tatami -- so the room's
    // sun can't shine down through the floor into it and its lamps can't light the room above. Its
    // materials are its own copies for the same reason (a material shared between the two scenes
    // could pick up the other scene's lights).
    underScene=new THREE.Scene();
    const uMat=m=>{ const c=m.clone(); c.envMapIntensity*=0.4; return c; };
    const matMidU=uMat(matMid), matDarkU=uMat(matDark), matGoldU=uMat(matGold);
    const stairs=new THREE.Group(); stairs.position.set(TRAP_X+TRAP_W/2-0.14,0,(z0+z1)/2); underScene.add(stairs);
    for(let i=0;i<N;i++){
      const y=-0.07-rise*i, x=-run*i;
      box(run+0.03,0.045,w,matMidU,x,y,0,stairs);                                         // tread
      box(0.04,rise+0.02,w,matMidU,x+run/2,y-rise/2+0.03,0,stairs);                        // riser
    }
    // A locked door at the foot of the stairs. It opens once the shiori key (hidden behind the
    // cabinet) has been found -- see hasKey/tapDoor() below -- and stays shut until then. The room
    // beyond it isn't built yet, so opening it just reveals darkness for now.
    const doorH=1.29;                                                        // 1.5x the original 0.86 height
    const lastTreadFarX=-run*(N-1)-(run+0.03)/2;
    const landW=w+1.1, doorX=lastTreadFarX-landW, doorY=-0.07-rise*(N-1);   // landing lengthened so the door frames cleanly once the (unchanged) descend camera move settles
    box(landW,0.05,TRAP_D,matMidU,(lastTreadFarX+doorX)/2,doorY-0.025,0,stairs);            // landing runs right out to the side walls
    const doorHinge=new THREE.Group(); doorHinge.position.set(doorX,doorY,-w/2); stairs.add(doorHinge);
    const doorPanel=buildHeavyDoor(doorHinge,doorH,w);
    decorateStairwell(stairs,{N,rise,run,w,halfW:TRAP_D/2,openX0:-(TRAP_W-0.14),lastTreadFarX,doorX,doorY,doorH,matDarkU});
    stairDoor={hinge:doorHinge,t:0,goal:0}; doorPanelRef=doorPanel;
    pickables.push(doorHinge);   // any part of the door -- studs, ring, straps -- counts as a tap on it
    STAIR_G.lastTreadFarX=lastTreadFarX; STAIR_G.doorX=doorX; STAIR_G.doorY=doorY; STAIR_G.landW=landW; STAIR_G.doorH=doorH;
    trapHinge=new THREE.Group(); trapHinge.position.set(TRAP_X,0,TRAP_ZF); scene.add(trapHinge);
    const trapTile=new THREE.Mesh(new THREE.BoxGeometry(TRAP_W,TRAP_THICK,TRAP_D),
      [matTatami,matTatami,matTatami,matMid,matTatami,matTatami]);                      // +x,-x,+y(top),-y(underside),+z,-z
    trapTile.position.set(0,-TRAP_THICK/2,TRAP_D/2);
    trapTile.castShadow=true; trapTile.receiveShadow=true;
    trapHinge.add(trapTile); pickables.push(trapTile);   // was missing entirely -- taps on the flap could never be detected
    trapCatcher.visible=false;
    const ci=pickables.indexOf(trapCatcher); if(ci>=0) pickables.splice(ci,1);
    // tapping down into the now-empty opening starts the descend camera move -- detected with pure
    // ray/plane maths in endPointer (see hitStairsOpening below), not a rendered mesh, so there is
    // nothing here that could ever show up as a stray visible surface.
    stairsOpening={xMin:TRAP_X-TRAP_W/2,xMax:TRAP_X+TRAP_W/2,zMin:TRAP_ZF,zMax:TRAP_ZN,y:-0.05};
    trap.opened=true; trap.goal=1;
  }catch(err){ console.error('hidden puzzle: failed to open',err); }
}
function toggleFlap(){ trap.opened=!trap.opened; trap.goal=trap.opened?1:0; }
function isDescendant(o,anc){ if(!anc) return false; while(o){ if(o===anc) return true; o=o.parent; } return false; }
function tapDoor(){
  if(!stairDoor) return;

    const base=stairDoor.hinge.rotation.y; let n=0;
    const id=setInterval(()=>{ stairDoor.hinge.rotation.y=base+(n%2?0.06:-0.06); n++; if(n>5){ clearInterval(id); stairDoor.hinge.rotation.y=base; } },70);
    return;
  }

}
// Rather than jumping straight to a fixed viewpoint, the target itself glides down the slope over
// a few seconds while r/theta/phi stay fixed -- since the offset from target to camera never
// changes, and the target moves in a straight line down the stairs, the camera keeps exactly the
// same distance from the stair surface throughout, which reads as smoothly walking down them.
let stairsRide=null;
function descendStairs(){
  if(!trap.opened||stairsRide) return;
  const run=0.24, rise=0.19, START_STEP=3, z=(TRAP_ZF_G+TRAP_ZN_G)/2, x0=TRAP_X_G+TRAP_W_G/2-0.14;
  goal.theta=Math.PI/2; goal.phi=0.71; goal.r=3.0; setAuto(false);
  // Two phases: first (0..SPLIT) is exactly the original tread-following glide -- phi fixed, target
  // following the tread line down to the landing -- unchanged from what already worked. Only the
  // last stretch (SPLIT..1) swings the aim point over to the door's own centre and eases phi down to
  // exactly level, so the door ends up centred and faced dead-on right at the very end, without
  // disturbing the well-tuned descent that came before it. STAIR_G.* are LOCAL to the stairs group,
  // so x0 (the group's own world position) is added back in to get real world coordinates.
  const sx=x0-run*START_STEP, sy=-0.07-rise*START_STEP;
  const mx=x0+(STAIR_G.lastTreadFarX+STAIR_G.doorX)/2, my=STAIR_G.doorY;
  const ex=x0+STAIR_G.doorX, ey=STAIR_G.doorY+STAIR_G.doorH/2;
  // Levelling off at the SAME r=3.0 would swing the camera ~3m back up the corridor while it's
  // still at floor height -- and the corridor (unlike the landing) is filled by the actual sloped
  // treads there, which is exactly the "sinks into the stairs" collision. So r eases down to 0.8
  // over the same final stretch: by the time the view is level (phi=PI/2), the camera has pulled
  // in close enough to stay within the landing itself, clear of every tread.
  stairsRide={t:0,duration:5.5,split:0.78,sx,sy,mx,my,ex,ey,z,phi0:0.71,phi1:Math.PI/2,r0:3.0,r1:1.6,openX:x0-(TRAP_W_G-0.14)};
}
function tapTrap(){
  if(trap.revealed) return;
  const now=performance.now();
  if(now-trap.last>TRAP_TAP_WINDOW) trap.taps=0;
  trap.taps++; trap.last=now;
  if(trap.taps>=5){ trap.revealed=true; openTrap(); }
}

// nothing for the camera to peek at behind or around the shelf before that happens.
const WALL_T=0.15, INNER_Z0=-WALL_T, INNER_Z1=-WALL_T-6.0;   // back wall thickness; the hidden room's front and far wall planes

// Re-UVs a mesh from its world-space vertex positions, so a piece cut out of a larger wall keeps that
// wall's original texture scale (x0..x0+w across, 0..h up). Box/Plane geometries otherwise stretch UV
// 0..1 over each face, which squashes the plaster -- and with it the bumpMap, making the bump far
// stronger, so the wall glitters as if lit twice as brightly. Faces whose normal runs along x
// (the doorway's reveals, side walls) use z across; faces whose normal runs along y use z up.
function worldUV(mesh,x0,w,h){
  mesh.updateMatrixWorld(true);
  const g=mesh.geometry, p=g.attributes.position, n=g.attributes.normal, uv=g.attributes.uv;
  const v=new THREE.Vector3(), nn=new THREE.Vector3(), nm=new THREE.Matrix3().getNormalMatrix(mesh.matrixWorld);
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i).applyMatrix4(mesh.matrixWorld); nn.fromBufferAttribute(n,i).applyMatrix3(nm);
    uv.setXY(i,((Math.abs(nn.x)>0.5?v.z:v.x)-x0)/w,(Math.abs(nn.y)>0.5?v.z:v.y)/h);
  }
  uv.needsUpdate=true;
}

/* ---------- the room behind the fusuma: a chic wa-yo (Japanese-Western) sitting room ---------- */
// It lives in its own scene (innerScene) with its own lights, rendered after the main scene into the
// same depth buffer (see tick()): the main room's walls hide it everywhere but the doorway, the main
// room's sun and lamps can't shine through the wall into it, and its lamps can't leak back out onto
// the main room's plaster. It is only drawn while the fusuma is open. Everything is built once, the
// first time the shelf is slid open, by buildInnerInterior() -- like the rest of the hidden room.
// Layout (x across, z into the room; the doorway is at x≈-0.92 on the front wall z0):
//   far wall: tokonoma straight ahead of the door, display shelf to its left, shoji window + bench
//   to its right; centre: rug, low table, two leather armchairs, paper pendant lantern above;
//   left wall: wool sofa + floor lamp + side table; right wall: sideboard, table lamp, gold-leaf art.

// walnut herringbone parquet, painted per pixel. Planks are 1 x n units; the pattern repeats every
// P units in both directions, so the canvas tiles seamlessly (plank ids are reduced mod P).
function drawHerringbone(g,w,h){
  const n=4, P=16, u=w/P;
  const img=g.createImageData(w,h), d=img.data;
  const tone=[]; for(let i=0;i<2*P;i++) tone.push([R(0.74,1.14),R(0,100),R(0.7,1.4),R(-0.06,0.06)]);
  const base=[106,68,41], dark=[48,28,15];
  for(let py=0;py<h;py++){
    const y=(py+0.5)/u, k=Math.floor(y);
    for(let px=0;px<w;px++){
      const x=(px+0.5)/u, m=Math.floor((x-k+n)/(2*n)), xl=x-2*n*m-k;
      let id,along,across;
      if(xl>=0){ id=(((k+2*n*m)%P)+P)%P; along=xl; across=y-k; }
      else{ const j=Math.floor(x-m*n); id=P+((((j-n*m)%P)+P)%P); across=x-m*n-j; along=y-(j+1-m*n); }
      const t0=tone[id];
      const wv=across*t0[2]*7+0.32*Math.sin(along*1.6+t0[1])+0.1*Math.sin(along*5.7+t0[1]*2);
      let gr=0.5+0.5*Math.sin(wv*Math.PI*2); gr=gr*gr*gr;
      const fig=0.5+0.5*Math.sin(along*0.7+t0[1]*0.7+across*2.4);
      const tt=Math.min(1,gr*0.5+fig*0.22+rnd()*0.08);
      let b=t0[0];
      const e=Math.min(across,1-across,along,n-along);
      if(e<0.022) b*=0.3; else if(e<0.06) b*=0.84+0.16*(e-0.022)/0.038;   // hairline joints with a slight eased bevel
      const i4=(py*w+px)*4;
      d[i4]=Math.min(255,(base[0]+(dark[0]-base[0])*tt)*b*(1+t0[3]));
      d[i4+1]=Math.min(255,(base[1]+(dark[1]-base[1])*tt)*b);
      d[i4+2]=Math.min(255,(base[2]+(dark[2]-base[2])*tt)*b*(1-t0[3]));
      d[i4+3]=255;
    }
  }
  g.putImageData(img,0,0);
}

// soft rounded box (a cushion): a sphere whose vertices are pushed out onto a rounded box, so the
// normals stay smooth. `bulge` puffs the top face up slightly. UVs are projected in metres.
function softBox(w,h,d,r,mat,bulge){
  const g=new THREE.SphereGeometry(1,28,18), p=g.attributes.position, uv=g.attributes.uv, v=new THREE.Vector3();
  const hx=w/2-r, hy=h/2-r, hz=d/2-r;
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    // near-zero components count as zero: sin(2*PI) is -2e-16, not 0, and Math.sign() of it used to fling the
    // sphere's seam column to the opposite edge, tearing a triangular hole in the side of every cushion
    const sg=a=>a>1e-6?1:a<-1e-6?-1:0;
    const x=sg(v.x)*hx+v.x*r, z=sg(v.z)*hz+v.z*r;
    let y=sg(v.y)*hy+v.y*r;
    if(bulge&&v.y>0) y+=bulge*Math.max(0,1-(2*x/w)**2)*Math.max(0,1-(2*z/d)**2);
    p.setXYZ(i,x,y,z);
    const ax=Math.abs(v.x), ay=Math.abs(v.y), az=Math.abs(v.z);
    if(ay>=ax&&ay>=az) uv.setXY(i,x/0.5,z/0.5); else if(ax>=az) uv.setXY(i,z/0.5,y/0.5); else uv.setXY(i,x/0.5,y/0.5);
  }
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat); m.castShadow=m.receiveShadow=true; return m;
}
function put(m,x,y,z,parent,ry,rx){ m.position.set(x,y,z); if(ry) m.rotation.y=ry; if(rx) m.rotation.x=rx; parent.add(m); return m; }

function mat2(o,env,phys){ return std(o,env,phys); }   // room-2-only materials (kept separate from the main room's)

let tCeilBoards=null;
function battenCeiling(parent,x0,x1,z0,z1,y,trim,cornice){
  tCeilBoards=tCeilBoards||canvasTex(512,512,drawCeilBoards);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,z1-z0),std({map:tCeilBoards,roughness:0.75},0.25));
  m.rotation.x=Math.PI/2; m.position.set((x0+x1)/2,y,(z0+z1)/2); m.receiveShadow=true; parent.add(m); worldUV(m,0,1.8,1.8);
  for(let x=x0+0.45;x<x1-0.1;x+=0.45) box(0.03,0.035,z1-z0,trim,x,y-0.0175,(z0+z1)/2,parent);
  if(cornice!==false){
    box(x1-x0,0.05,0.05,trim,(x0+x1)/2,y-0.025,z0+0.025,parent); box(x1-x0,0.05,0.05,trim,(x0+x1)/2,y-0.025,z1-0.025,parent);
    box(0.05,0.05,z1-z0,trim,x0+0.025,y-0.025,(z0+z1)/2,parent); box(0.05,0.05,z1-z0,trim,x1-0.025,y-0.025,(z0+z1)/2,parent);
  }

function buildInnerInterior(z0,z1){
  const S=new THREE.Scene();
  const RW=ROOM_W, RD=z0-z1, zc=(z0+z1)/2, cx=(doorX0+doorX1)/2;

  /* materials */
  const tFloor=canvasTex(1536,1536,drawHerringbone);
  const matFloor=mat2({map:tFloor,bumpMap:tFloor,bumpScale:0.35,roughness:0.4,clearcoat:0.45,clearcoatRoughness:0.22},0.7,true);
  const tPl=canvasTex(640,640,(g,w,h)=>drawPlaster(g,w,h,'#6e665b'));
  const matPl=mat2({map:tPl,bumpMap:tPl,bumpScale:0.7,roughness:0.96},0.2);
  const tPlInk=canvasTex(512,512,(g,w,h)=>drawPlaster(g,w,h,'#38332d'));
  const matPlInk=mat2({map:tPlInk,bumpMap:tPlInk,bumpScale:0.7,roughness:0.97},0.15);

function buildInnerRoom(){
  if(innerRoomBuilt) return; innerRoomBuilt=true;
  try{
    scene.remove(backWall); backWall.geometry.dispose();
    // Same material and same shadow behaviour as the original single plane (matWallA, receiveShadow
    // only, never castShadow) -- so cutting the doorway changes nothing about how this wall is lit;
    // only the doorway opening itself is new.
    const leftW=doorX0+ROOM_W/2, rightW=ROOM_W/2-doorX1;
    const wSeg1=box(leftW,ROOM_H,WALL_T,matWallA,(-ROOM_W/2+doorX0)/2,ROOM_H/2,-WALL_T/2,scene);
    const wSeg2=box(rightW,ROOM_H,WALL_T,matWallA,(doorX1+ROOM_W/2)/2,ROOM_H/2,-WALL_T/2,scene);
    const wSeg3=box(doorW,ROOM_H-doorH,WALL_T,matWallA,(doorX0+doorX1)/2,(doorH+ROOM_H)/2,-WALL_T/2,scene);
    [wSeg1,wSeg2,wSeg3].forEach(m=>{ m.castShadow=false; m.receiveShadow=true; worldUV(m,-ROOM_W/2,ROOM_W,ROOM_H); });
    // thin dark-wood trim around the opening, mounted on the front face
    box(0.04,doorH+0.04,0.03,matDark,doorX0-0.02,doorH/2,0.02,scene);
    box(0.04,doorH+0.04,0.03,matDark,doorX1+0.02,doorH/2,0.02,scene);
    box(doorW+0.08,0.04,0.03,matDark,(doorX0+doorX1)/2,doorH+0.02,0.02,scene);
    // split the tokonoma-style alcove patch around the new opening -- keeping its narrow strip left of
    // the doorway too, so the wall the shelf uncovers stays the same dark plaster it was before
    alcove.geometry.dispose(); alcove.geometry=new THREE.PlaneGeometry(1.54-doorX1,ROOM_H);
    alcove.position.x=(doorX1+1.54)/2; worldUV(alcove,-1.54,3.08,ROOM_H);
    const alcoveL=new THREE.Mesh(new THREE.PlaneGeometry(doorX0+1.54,ROOM_H),matWallB);
    alcoveL.position.set((-1.54+doorX0)/2,ROOM_H/2,alcove.position.z); alcoveL.receiveShadow=true; scene.add(alcoveL);
    worldUV(alcoveL,-1.54,3.08,ROOM_H);
    // and above the opening, so no patch of the lighter plaster shows over the fusuma
    const alcoveT=new THREE.Mesh(new THREE.PlaneGeometry(doorW,ROOM_H-doorH),matWallB);
    alcoveT.position.set((doorX0+doorX1)/2,(doorH+ROOM_H)/2,alcove.position.z); alcoveT.receiveShadow=true; scene.add(alcoveT);
    worldUV(alcoveT,-1.54,3.08,ROOM_H);

    const newDoor=fusumaDoor(doorW,doorH);
    newDoor.position.set((doorX0+doorX1)/2,doorH/2,0.03); scene.add(newDoor);
    makeMovable(newDoor,'x',doorW+0.02,'inner-door');

    innerDoorMv=newDoor.userData.mv;

/* ---------- walking into the hidden room, and looking all the way round inside it ---------- */
// Tapping the fusuma opens it and glides the camera along the doorway's own axis, through the opening,
// to an eye point inside the room (roomRide). Once there (roomView) the eye stays put and dragging turns
// the view through a full 360 degrees -- r collapses to a few centimetres, so the orbit rig becomes a
// look-around -- while pinch/wheel zoom by narrowing the field of view. 部屋を出る (or 位置をリセット)
// backs the camera out the same way, facing into the room, and closes the fusuma behind it.
const DOOR_CX=(doorX0+doorX1)/2;
const ROOM_EYE=new THREE.Vector3(DOOR_CX,1.42,-1.75);
const DOOR_FRONT=new THREE.Vector3(DOOR_CX,1.42,1.1);
function camOffset(th,ph,r){ const sp=Math.sin(ph); return new THREE.Vector3(r*sp*Math.sin(th),r*Math.cos(ph),r*sp*Math.cos(th)); }
// kf: [{u, th, ph}] view-direction keys at fractions u of the (eased) ride; path: a smooth curve for the eye
function startRoomRide(points,kf,duration,done){
  roomRide={t:0,duration,curve:new THREE.CatmullRomCurve3(points,false,'centripetal'),kf,done};
  setAuto(false);
}
function updateRoomRide(dt){
  const R_=roomRide; R_.t=Math.min(1,R_.t+dt/R_.duration);
  const e=ease(R_.t), P=R_.curve.getPointAt(e), k=R_.kf;
  let i=0; while(i<k.length-2&&e>k[i+1].u) i++;
  const f=clamp((e-k[i].u)/(k[i+1].u-k[i].u),0,1), th=lerp(k[i].th,k[i+1].th,f), ph=lerp(k[i].ph,k[i+1].ph,f), r=0.05;
  cur.theta=goal.theta=th; cur.phi=goal.phi=ph; cur.r=goal.r=r;
  cur.target.copy(P).sub(camOffset(th,ph,r)); goal.target.copy(cur.target);
  if(R_.t>=1){ roomRide=null; R_.done(); }
}
// glide the eye to E while turning to look at P (inside the room)
function lookRide(E,P,dur,done){
  const d=P.clone().sub(E).normalize();
  let th=Math.atan2(-d.x,-d.z); const ph=Math.acos(clamp(-d.y,-1,1));
  th+=Math.round((cur.theta-th)/(Math.PI*2))*Math.PI*2;   // turn the short way round
  const from=camera.position.clone(); if(from.distanceTo(E)<0.02) E=E.clone().add(new THREE.Vector3(0,0.02,0));
  startRoomRide([from,E],[{u:0,th:cur.theta,ph:cur.phi},{u:1,th,ph}],dur,done||(()=>{}));
}
// after tapping something that moves: step over to it -- about a metre away, a little above it, looking at it
function focusInnerPoint(P,dist){
  if(roomRide) return;
  const dh=new THREE.Vector3(camera.position.x-P.x,0,camera.position.z-P.z);
  if(dh.lengthSq()<1e-6) dh.set(0,0,1); dh.normalize();
  const E=P.clone().addScaledVector(dh,dist||1.15);
  E.y=clamp(P.y+(dist?0.15:0.45),1.0,1.6); E.x=clamp(E.x,-3.7,3.7); E.z=clamp(E.z,INNER_Z1+0.9,INNER_Z0-0.5);
  lookRide(E,P,1.6);
}
// two-finger drag inside the room: sideways drag steps sideways, up/down drag walks forward/back
function walkBy(dx,dy){
  if(roomRide) return;
  const f=new THREE.Vector3(-Math.sin(goal.theta),0,-Math.cos(goal.theta)), r=new THREE.Vector3(-f.z,0,f.x), k=0.006;
  goal.target.addScaledVector(r,-dx*k).addScaledVector(f,dy*k);
  goal.target.x=clamp(goal.target.x,-3.8,3.8); goal.target.z=clamp(goal.target.z,INNER_Z1+0.5,INNER_Z0-0.4);
}
function backToRoomCentre(){ if(!roomRide) lookRide(ROOM_EYE.clone(),ROOM_EYE.clone().add(new THREE.Vector3(0,-0.05,-1)),1.6); }
function enterInnerRoom(){
  if(!innerDoorMv||roomRide||roomView) return;
  innerDoorMv.goal=1;
  const th0=cur.theta, th1=Math.round(th0/(Math.PI*2))*Math.PI*2;   // face straight into the room, turning the short way
  startRoomRide([camera.position.clone(),DOOR_FRONT.clone(),ROOM_EYE.clone()],
    [{u:0,th:th0,ph:cur.phi},{u:0.45,th:th1,ph:Math.PI/2},{u:1,th:th1,ph:1.6}],3.4,
    ()=>{ roomView=true; $('bExit').hidden=false; });
}
function exitInnerRoom(){
  if(!roomView||roomRide) return;
  roomView=false; $('bExit').hidden=true;
  const th0=cur.theta, k=Math.round(th0/(Math.PI*2))*Math.PI*2;
  const homeCam=home.target.clone().add(camOffset(home.theta,home.phi,home.r));
  const pts=[camera.position.clone()]; if(camera.position.distanceTo(ROOM_EYE)>0.1) pts.push(ROOM_EYE.clone());
  pts.push(DOOR_FRONT.clone(),homeCam);
  startRoomRide(pts,
    [{u:0,th:th0,ph:cur.phi},{u:0.3,th:k,ph:Math.PI/2},{u:0.6,th:k,ph:Math.PI/2},{u:1,th:k+home.theta,ph:home.phi}],pts.length>3?4.0:3.2,
    ()=>{ innerDoorMv.goal=0;
      cur.theta=goal.theta=home.theta; cur.phi=goal.phi=home.phi; cur.r=goal.r=home.r;
      cur.target.copy(home.target); goal.target.copy(home.target); });
}
$('bExit').addEventListener('click',exitInnerRoom);
// Built now (in its own scene, not drawn until the fusuma opens) rather than on first use, and rendered
// once behind the loading screen: compiling its shaders and uploading its textures on the first tap
// used to freeze the fusuma for a moment before it began to open.
battenCeiling(scene,-ROOM_W/2,ROOM_W/2,0,ROOM_D,ROOM_H,matDark);
innerRoom=buildInnerInterior(INNER_Z0,INNER_Z1); innerScene=innerRoom.scene;

/* ---------- buttons ---------- */
const shojiMvs=movables.filter(m=>m.tag==='shoji');
function setShoji(open){
  shojiMvs.forEach(m=>{ m.goal=open?1:0; });
}
$('bReset').addEventListener('click',()=>{
  if(roomRide) return;
  if(roomView){ backToRoomCentre(); return; }
  goal.theta=home.theta; goal.phi=home.phi; goal.r=home.r; goal.target.copy(home.target); setAuto(false);
});
setTimeout(()=>{ $('hint').style.opacity='0'; },14000);

/* ---------- loop ---------- */
const clock=new THREE.Clock(); let first=true;
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05), time=clock.elapsedTime;
  for(const m of movables){
    if(Math.abs(m.goal-m.t)>0.0004){ m.t+=(m.goal-m.t)*(1-Math.exp(-dt*7)); m.obj.position[m.axis]=m.base+m.delta*m.t; }
  }
  if(autoRotate) goal.theta=Math.sin(time*0.22)*0.6;
  if(trapHinge&&Math.abs(trap.goal-trap.t)>0.0004){ trap.t+=(trap.goal-trap.t)*(1-Math.exp(-dt*1.6)); trapHinge.rotation.x=-(Math.PI/2)*ease(clamp(trap.t,0,1)); }
  if(stairsRide){
    const R=stairsRide; R.t=Math.min(1,R.t+dt/R.duration);
    if(R.t<=R.split){
      const f=ease(R.t/R.split);
      goal.target.set(lerp(R.sx,R.mx,f),lerp(R.sy,R.my,f),R.z); goal.phi=R.phi0; goal.r=R.r0;
    }else{
      const f=ease((R.t-R.split)/(1-R.split));
      goal.target.set(lerp(R.mx,R.ex,f),lerp(R.my,R.ey,f),R.z); goal.phi=lerp(R.phi0,R.phi1,f); goal.r=lerp(R.r0,R.r1,f);
    }
    // The camera rides ~2m up-slope of the target, so it ducks under the stairwell's ceiling right at the
    // opening's far edge (header beam, y≈-0.05..-0.19) -- it used to pass straight through it. Dip the
    // whole view smoothly by up to 0.42m only while the camera is near that edge; elsewhere it's unchanged.
    { const camX=goal.target.x+goal.r*Math.sin(goal.phi), u=(camX-R.openX)/0.95;
      if(Math.abs(u)<1) goal.target.y-=0.42*(1-u*u)*(1-u*u); }
    if(R.t>=1) stairsRide=null;
  }
  if(stairDoor&&Math.abs(stairDoor.goal-stairDoor.t)>0.0004){ stairDoor.t+=(stairDoor.goal-stairDoor.t)*(1-Math.exp(-dt*1.8)); stairDoor.hinge.rotation.y=-Math.PI*0.72*ease(clamp(stairDoor.t,0,1)); }
  if(scrollCurl&&Math.abs(scrollSwing.goal-scrollSwing.t)>0.0004){ scrollSwing.t+=(scrollSwing.goal-scrollSwing.t)*(1-Math.exp(-dt*3)); updateScrollCurl(scrollCurl.maxAngle*ease(clamp(scrollSwing.t,0,1))); }
  if(handleGroup&&Math.abs(handleSpin.target-handleSpin.angle)>0.001){ handleSpin.angle+=(handleSpin.target-handleSpin.angle)*(1-Math.exp(-dt*2.2)); handleGroup.rotation.z=handleSpin.angle; }
  if(Math.abs(shelfSlide.goal-shelfSlide.t)>0.0004){ shelfSlide.t+=(shelfSlide.goal-shelfSlide.t)*(1-Math.exp(-dt*2)); shelf.position.x=SHELF_SLIDE_DIST*ease(clamp(shelfSlide.t,0,1)); }
  if(roomRide) updateRoomRide(dt);
  innerRoom.update(dt);
  const k=1-Math.exp(-dt*6);
  { const fw=roomView?roomFov:baseFov(); if(Math.abs(camera.fov-fw)>0.01){ camera.fov+=(fw-camera.fov)*(1-Math.exp(-dt*3)); camera.updateProjectionMatrix(); } }
  cur.theta+=(goal.theta-cur.theta)*k; cur.phi+=(goal.phi-cur.phi)*k; cur.r+=(goal.r-cur.r)*k; cur.target.lerp(goal.target,k);
  const sp=Math.sin(cur.phi);
  camera.position.set(cur.target.x+cur.r*sp*Math.sin(cur.theta),cur.target.y+cur.r*Math.cos(cur.phi),cur.target.z+cur.r*sp*Math.cos(cur.theta));
  camera.lookAt(cur.target);
  lampLight.intensity=1.9*(1+0.04*Math.sin(time*7.3)*Math.sin(time*2.1));
  updateShowcase(dt,time);
  renderer.render(scene,camera);
  // the room behind the fusuma, drawn over the same depth buffer -- only while the fusuma is open
  if(innerScene&&innerDoorMv&&innerDoorMv.t>0.002){ renderer.autoClear=false; renderer.render(innerScene,camera); renderer.autoClear=true; }
  // likewise the stairwell under the tatami -- whenever the hatch is open or the camera is down there
  if(underScene&&(trap.t>0.002||camera.position.y<0.05)){ renderer.autoClear=false; renderer.render(underScene,camera); renderer.autoClear=true; }
  if(first){ first=false; renderer.autoClear=false; renderer.render(innerScene,camera); renderer.autoClear=true;   // warm-up, hidden by the loading screen
    loadingEl.style.opacity='0'; setTimeout(()=>loadingEl.remove(),1000); }
}
tick();
})();
</script>
</body>
