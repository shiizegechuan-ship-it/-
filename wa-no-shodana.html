<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>和の書棚 ― 書院造の書斎 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&display=swap">
<style>
:root{
  --bg:#0d0a08; --panel:rgba(18,12,8,.7); --panel-hover:rgba(64,42,22,.82);
  --line:rgba(214,176,98,.55); --ink:#f1e6cf; --muted:#cdbd93;
}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--ink);
  font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;}
#app{position:fixed;inset:0;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#app:active{cursor:grabbing}
canvas{display:block}
.hud{position:fixed;inset:0;pointer-events:none}
.hint{position:absolute;left:20px;top:18px;max-width:min(80vw,440px);font-size:12px;line-height:1.9;letter-spacing:.1em;
  color:var(--muted);text-shadow:0 1px 4px #000;transition:opacity 1.6s}
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:auto;padding:0 12px;width:max-content;max-width:100%;box-sizing:border-box}
.bar button{font:inherit;font-size:13px;letter-spacing:.14em;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);padding:9px 16px;border-radius:2px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.bar button:hover{background:var(--panel-hover)}
.bar button:focus-visible{outline:2px solid #e8c878;outline-offset:2px}
.bar button[hidden]{display:none}
/* item box (top centre) and lightbox */
#items{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;z-index:7;
  max-width:calc(100vw - 20px);box-sizing:border-box;overflow-x:auto;overscroll-behavior:contain;scrollbar-width:thin;touch-action:pan-x;
  padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:3px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#items[hidden]{display:none}
#items button{flex:0 0 auto;width:52px;height:52px;padding:0;border:1px solid rgba(214,176,98,.35);border-radius:2px;background:rgba(0,0,0,.35);cursor:pointer}
#items button.empty{cursor:default;opacity:.45}
#items button.sel{border-color:#e8c878;box-shadow:0 0 0 2px rgba(232,200,120,.5),0 0 12px rgba(232,200,120,.45)}
#items canvas{width:100%;height:100%;display:block}
#lb{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.62);pointer-events:auto;z-index:6}
#lb[hidden]{display:none}
#lb .card{width:min(86vw,340px);padding:18px 18px 16px;background:rgba(24,16,10,.94);border:1px solid var(--line);border-radius:3px;text-align:center}
#lb canvas{display:block;margin:0 auto;width:240px;height:240px;max-width:100%}
#lb b{display:block;margin-top:6px;font-size:17px;letter-spacing:.2em}
#lb p{margin:8px 0 0;font-size:13px;line-height:1.8;color:var(--muted)}
#lb .msg{min-height:1.8em;color:#e8c878}
#lb .x{position:absolute;margin:-10px 0 0 calc(min(86vw,340px) - 52px);background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer}
#toast{position:absolute;top:84px;left:50%;transform:translateX(-50%);max-width:min(90vw,560px);white-space:normal;text-align:center;line-height:1.7;padding:7px 16px;background:var(--panel);border:1px solid var(--line);
  font-size:13px;letter-spacing:.12em;opacity:0;transition:opacity .5s}
#toast.on{opacity:1}
@media (max-width:520px){ #items button{width:42px;height:42px} #toast{top:70px} }
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);
  letter-spacing:.45em;font-size:14px;transition:opacity .9s;z-index:5}
@media (prefers-reduced-motion: reduce){ #loading,.hint{transition:none} }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <div class="hint" id="hint">ドラッグで見回す ／ ホイール・ピンチで寄る<br>障子・戸・引き出しをクリックで開閉 ／ 障子を開くと、中の和綴じの本をクリックで取り出せます<br>ダブルクリックでその場所へ</div>
  <div class="bar">
    <button id="bReset" type="button">位置をリセット</button>
    <button id="bExit" type="button" hidden>部屋を出る</button>
  </div>
  <div id="items" hidden></div>
  <div id="toast"></div>
  <div id="lb" hidden><div class="card"><button class="x" type="button" aria-label="閉じる">×</button><canvas width="440" height="440"></canvas><b></b><p class="desc"></p><p class="msg"></p></div></div>
</div>
<div id="loading">読み込み中</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
'use strict';
/* ===== MAP (read first) ==============================================================
 One IIFE, top to bottom. Search the "---------- name ----------" headers.
   utils / renderer / env   seeded rnd() (changing call order changes every random layout), clamp/lerp/ease,
                            step() eases any {t,goal} toward its goal; std() makes every lit material
   textures                 canvasTex(w,h,draw) + drawX() painters (wood, paper, plaster, spines, scrolls...)
   room / shelf / books     main room, the cabinet (box() adds to `shelf` by default), books (fillShelf),
                            the 27 和綴之書 (WA_* config; append to WA_COLORS for a new cover colour,
                            to TITLES for a new plain book)
   lights / camera          night lighting; orbit camera (goal eased into cur), pointer/wheel handlers
   showcase                 tap a 和綴之書: buildRig() -> updateShowcase() floats it out and opens it
   trapdoor + stairwell     5 taps on the tatami -> openTrap(); stairs/door in their own `underScene`;
                            the door opens once the shiori (behind the centre back panel) is collected
   hidden room              the scroll's handle slides the shelf (tapHandle) and cuts a doorway with a fusuma
                            (buildInnerRoom); the furnished room is `innerScene` (buildInnerInterior,
                            built at startup). Tap the fusuma to walk in; props carry userData.innerAct
                            (movable() there) -- give any object one to make a new puzzle piece.
   items                    ITEMS (name, description, icon painter), RECIPES ([a,b,result]) and USES (places that
                            need an item -- the puzzle's order lives there); itemProp() makes something a
                            pick-up, lockable() puts a hidden-room object behind a USES entry; giveItem(id). Item box shows
                            after first entering the hidden room: tap = select, tap again = lightbox, and with
                            the lightbox open, tapping another item tries a recipe.
   loop                     tick(): animations, camera, then main scene + innerScene + underScene
 Taps: main room -> raycast `pickables`; inside the hidden room -> innerRoom.pick() (its own scene only).
 Animations: makeMovable() (main room, slides along an axis, tag groups them) and step() for the rest.
====================================================================================== */
const loadingEl=document.getElementById('loading');
if(!window.THREE){ loadingEl.textContent='three.js を読み込めませんでした'; return; }

const FONT='"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif';
const TITLES=[
 ['源氏物語','紫式部'],['枕草子','清少納言'],['徒然草','兼好'],['方丈記','長明'],['万葉集',''],['古今和歌集',''],
 ['平家物語',''],['奥の細道','芭蕉'],['雨月物語','秋成'],['竹取物語',''],['伊勢物語',''],['土佐日記','貫之'],
 ['更級日記',''],['今昔物語集',''],['古事記',''],['日本書紀',''],['風姿花伝','世阿弥'],['五輪書','武蔵'],
 ['葉隠',''],['茶の本','天心'],['陰翳礼讃','谷崎'],['吾輩は猫である','漱石'],['坊っちゃん','漱石'],['こころ','漱石'],
 ['草枕','漱石'],['三四郎','漱石'],['夢十夜','漱石'],['舞姫','鷗外'],['五重塔','露伴'],['雪国','川端'],
 ['伊豆の踊子','川端'],['羅生門','芥川'],['蜘蛛の糸','芥川'],['走れメロス','太宰'],['斜陽','太宰'],['銀河鉄道の夜','賢治'],
 ['風の又三郎','賢治'],['山月記','中島'],['檸檬','梶井'],['細雪','谷崎'],['浮雲','四迷'],['たけくらべ','一葉'],
 ['遠野物語','柳田'],['学問のすゝめ','諭吉'],['蕪村句集',''],['一茶句集',''],['花伝書',''],['歎異抄',''],
 ['禅と日本文化','鈴木'],['武士道','新渡戸'],['日本の面影','八雲'],['山家集','西行']
];
try{
  const chars=TITLES.map(t=>t[0]+t[1]).join('')+'書雅和松梅綴之鴛照眛琉';
  await Promise.race([
    Promise.all([document.fonts.load('700 40px "Noto Serif JP"',chars),document.fonts.load('500 40px "Noto Serif JP"',chars)]),
    new Promise(r=>setTimeout(r,4000))
  ]);
}catch(e){}

/* ---------- utils ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(20260919);
const R=(a,b)=>a+(b-a)*rnd();
const pick=arr=>arr[Math.floor(rnd()*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t*t*(3-2*t);
// Moves a.t (0..1) toward a.goal at rate k; returns the eased value while moving, or null once settled.
function step(a,dt,k){ if(Math.abs(a.goal-a.t)<=0.0004) return null; a.t+=(a.goal-a.t)*(1-Math.exp(-dt*k)); return ease(clamp(a.t,0,1)); }
const lerp=(a,b,t)=>a+(b-a)*t;
const C=hex=>new Color(hex).convertSRGBToLinear();
const {Mesh,Group,Vector3,PlaneGeometry,CylinderGeometry,DoubleSide,BoxGeometry,SphereGeometry,TorusGeometry,Color,MeshBasicMaterial,PointLight,CatmullRomCurve3,TubeGeometry,LatheGeometry,Vector2,Scene,SpotLight,HemisphereLight,ConeGeometry}=THREE, PI=Math.PI;
// a new Group at (x,y,z), turned ry about y, added to parent
function group(parent,x,y,z,ry){ const g=new Group(); g.position.set(x,y,z); if(ry) g.rotation.y=ry; parent.add(g); return g; }

/* ---------- renderer ---------- */
const host=document.getElementById('app');
let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
}catch(e){ loadingEl.textContent='WebGL を利用できません'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
host.appendChild(renderer.domElement);
const scene=new Scene();
scene.background=new Color(0x0d0a08);
const camera=new THREE.PerspectiveCamera(38,1,0.05,60);
const maxAniso=renderer.capabilities.getMaxAnisotropy();

/* ---------- environment (reflections) ---------- */
function buildEnv(){
  const es=new Scene();
  const sg=new SphereGeometry(20,32,16);
  const p=sg.attributes.position, cols=new Float32Array(p.count*3);
  const top=[0.20,0.16,0.12], hor=[0.50,0.38,0.27], bot=[0.22,0.22,0.10];
  for(let i=0;i<p.count;i++){
    const y=p.getY(i)/20, a=y>=0?top:bot, k=Math.pow(Math.abs(y),0.7);
    cols[i*3]=hor[0]+(a[0]-hor[0])*k; cols[i*3+1]=hor[1]+(a[1]-hor[1])*k; cols[i*3+2]=hor[2]+(a[2]-hor[2])*k;
  }
  sg.setAttribute('color',new THREE.BufferAttribute(cols,3));
  es.add(new Mesh(sg,new MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  const win=(w,h,pos,c)=>{
    const m=new Mesh(new PlaneGeometry(w,h),new MeshBasicMaterial({color:new Color(c[0],c[1],c[2]),side:DoubleSide}));
    m.position.set(pos[0],pos[1],pos[2]); m.lookAt(0,1,0); es.add(m);
  };
  win(10,6,[-14,6,8],[6,5.4,4.4]);
  win(14,4,[10,10,14],[2.4,2.3,2.2]);
  win(20,10,[0,14,0],[0.9,0.85,0.75]);
  const pm=new THREE.PMREMGenerator(renderer);
  const rt=pm.fromScene(es,0.03);
  pm.dispose();
  return rt.texture;
}
const envTex=buildEnv();

/* ---------- textures ---------- */
function canvasTex(w,h,draw,o){
  o=o||{};
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c);
  t.encoding=THREE.sRGBEncoding;
  if(o.repeat!==false){ t.wrapS=t.wrapT=THREE.RepeatWrapping; }
  t.anisotropy=maxAniso;
  return t;
}
function wrapped(w,h,fn){ for(const dx of [-w,0,w]) for(const dy of [-h,0,h]) fn(dx,dy); }

function drawWood(g,w,h,o){
  g.fillStyle=o.base; g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){
    const y=rnd()*h, th=R(6,60), a=R(0.04,0.14), col=rnd()<0.55?o.dark:o.light;
    for(const off of [-h,0,h]){
      const grd=g.createLinearGradient(0,y+off-th,0,y+off+th);
      grd.addColorStop(0,`rgba(${col},0)`); grd.addColorStop(0.5,`rgba(${col},${a})`); grd.addColorStop(1,`rgba(${col},0)`);
      g.fillStyle=grd; g.fillRect(0,y+off-th,w,th*2);
    }
  }
  g.lineCap='round';
  const n=o.lines*5;
  for(let i=0;i<n;i++){
    const y0=rnd()*h, col=rnd()<0.62?o.dark:o.light;
    g.strokeStyle=`rgba(${col},${R(0.05,0.28)})`;
    g.lineWidth=R(0.4,1.8);
    const amp=R(0.4,5)*o.wave, k=1+Math.floor(rnd()*4), ph=rnd()*6.283;
    for(const off of [-h,0,h]){
      g.beginPath();
      for(let x=0;x<=w;x+=16){
        const y=y0+off+Math.sin(x/w*6.283*k+ph)*amp;
        if(x===0)g.moveTo(x,y); else g.lineTo(x,y);
      }
      g.stroke();
    }
  }
  for(let i=0;i<2200;i++){
    g.fillStyle=`rgba(${o.dark},${R(0.05,0.2)})`;
    g.fillRect(rnd()*w,rnd()*h,R(2,9),R(0.5,1.2));
  }
}
function drawPaper(g,w,h,o){
  g.fillStyle=o.base; g.fillRect(0,0,w,h);
  for(let i=0;i<40;i++){
    const x=rnd()*w,y=rnd()*h,r=R(30,110);
    wrapped(w,h,(dx,dy)=>{
      const gr=g.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,r);
      gr.addColorStop(0,`rgba(${rnd()<.5?'120,90,50':'255,255,255'},.05)`); gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr; g.fillRect(x+dx-r,y+dy-r,r*2,r*2);
    });
  }
  for(let i=0;i<o.fibers;i++){
    const x=rnd()*w,y=rnd()*h,l=R(6,30),a=rnd()*6.283;
    g.strokeStyle=rnd()<.5?`rgba(255,255,255,${R(.1,.35)})`:`rgba(120,90,50,${R(.03,.12)})`;
    g.lineWidth=R(.4,1.2);
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke();
  }
  if(o.gold){
    for(let i=0;i<o.gold;i++){
      const x=rnd()*w,y=rnd()*h,s=R(1.5,6);
      g.save(); g.translate(x,y); g.rotate(rnd()*3.14);
      g.fillStyle=`rgba(${215+rnd()*25|0},${170+rnd()*25|0},${80+rnd()*30|0},${R(.35,.85)})`;
      g.fillRect(0,0,s,s*R(.4,1)); g.restore();
    }
  }
}
function drawPlaster(g,w,h,base){
  g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let i=0;i<220;i++){
    const x=rnd()*w,y=rnd()*h,r=R(30,150),dark=rnd()<.5;
    wrapped(w,h,(dx,dy)=>{
      const gr=g.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,r);
      gr.addColorStop(0,dark?`rgba(40,28,15,${R(.05,.13)})`:`rgba(255,240,215,${R(.04,.10)})`); gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr; g.fillRect(x+dx-r,y+dy-r,r*2,r*2);
    });
  }
  for(let i=0;i<9000;i++){
    g.fillStyle=rnd()<.5?`rgba(30,20,10,${R(.05,.25)})`:`rgba(255,245,225,${R(.05,.22)})`;
    g.fillRect(rnd()*w,rnd()*h,R(1,2.6),R(1,2.6));
  }
}
function drawTatami(g,w,h){
  g.fillStyle='#a8a66a'; g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=2){
    g.fillStyle=`rgba(${rnd()<.5?'255,250,190':'70,70,30'},${R(.04,.16)})`; g.fillRect(0,y,w,1);
  }
  for(let i=0;i<600;i++){
    g.fillStyle=`rgba(${rnd()<.5?'255,250,190':'70,70,30'},${R(.05,.18)})`; g.fillRect(rnd()*w,rnd()*h,R(20,120),R(1,2));
  }
  for(let x=0;x<w;x+=10){ g.fillStyle='rgba(60,60,20,.05)'; g.fillRect(x,0,1,h); }
  const b=Math.round(h*0.045);
  for(const y0 of [0,h-b]){
    g.fillStyle='#1b1d27'; g.fillRect(0,y0,w,b);
    g.fillStyle='rgba(200,180,120,.18)'; g.fillRect(0,y0===0?b-3:y0,w,3);
    for(let x=0;x<w;x+=14){ g.fillStyle='rgba(255,255,255,.05)'; g.fillRect(x,y0+b*0.3,7,b*0.4); }
  }
  g.strokeStyle='rgba(40,40,10,.45)'; g.lineWidth=3; g.strokeRect(0,0,w,h);
}
function drawFusuma(g,w,h){
  const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'#1b2c48'); gr.addColorStop(1,'#0e1626');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  const s=32;
  for(let y=0;y<h;y+=s)for(let x=0;x<w;x+=s){ if(rnd()<0.10){ g.fillStyle=`rgba(214,172,84,${R(.05,.14)})`; g.fillRect(x+1,y+1,s-2,s-2);} }
  for(let band=0;band<5;band++){
    const cy=h*(0.14+band*0.19);
    const grd=g.createLinearGradient(0,cy-20,0,cy+20);
    grd.addColorStop(0,'rgba(240,206,120,0.95)'); grd.addColorStop(1,'rgba(176,132,52,0.85)');
    g.fillStyle=grd;
    for(let k=0;k<9;k++){
      g.beginPath(); g.ellipse((k+R(-.2,.2))*w/8,cy+R(-5,5),R(46,95),R(9,16),0,0,6.283); g.fill();
    }
    for(let k=0;k<160;k++){ g.fillStyle=`rgba(240,210,130,${R(.2,.7)})`; g.fillRect(rnd()*w,cy+R(-6,32),R(1,2.6),R(1,2.6)); }
  }
}
function drawMakie(g,w,h){
  g.fillStyle='#120d0a'; g.fillRect(0,0,w,h);
  for(let i=0;i<7000;i++){
    const x=rnd()*w,y=rnd()*h,dens=Math.pow(y/h,1.6);
    if(rnd()>0.15+dens*0.85) continue;
    g.fillStyle=`rgba(${210+rnd()*30|0},${165+rnd()*30|0},${70+rnd()*30|0},${R(.15,.8)})`;
    const s=R(.6,2.4); g.fillRect(x,y,s,s);
  }
  for(let b=0;b<4;b++){
    const y=h*(.5+b*.14), gr=g.createLinearGradient(0,y-30,0,y+30);
    gr.addColorStop(0,'rgba(200,150,60,0)'); gr.addColorStop(.5,'rgba(200,150,60,.10)'); gr.addColorStop(1,'rgba(200,150,60,0)');
    g.fillStyle=gr; g.fillRect(0,y-30,w,60);
  }
}
function vtext(g,s,cx,y0,maxH,maxW,color,weight){
  const chars=[...s]; if(!chars.length) return;
  const size=Math.min(maxW,maxH/chars.length);
  g.font=`${weight} ${size}px ${FONT}`; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle=color;
  let y=y0+(maxH-size*chars.length)/2+size/2;
  for(const c of chars){ g.fillText(c,cx,y); y+=size; }
}
function goldGrad(g,w,silver){
  const gr=g.createLinearGradient(0,0,w,0);
  if(silver){ gr.addColorStop(0,'#9aa1a8'); gr.addColorStop(.5,'#f2f4f6'); gr.addColorStop(1,'#8b929a'); }
  else { gr.addColorStop(0,'#a9812f'); gr.addColorStop(.5,'#f3d580'); gr.addColorStop(1,'#a07728'); }
  return gr;
}
function drawSpine(g,w,h,st,title,author){

function mapBoxUV(g,w,h,d,S){
  const pos=g.attributes.position,nor=g.attributes.normal,uv=g.attributes.uv;
  const dims=[w,h,d]; let L=0; if(h>dims[L])L=1; if(d>dims[L])L=2;
  const off=[rnd()*10,rnd()*10];
  for(let i=0;i<pos.count;i++){
    const p=[pos.getX(i),pos.getY(i),pos.getZ(i)];
    const n=[Math.abs(nor.getX(i)),Math.abs(nor.getY(i)),Math.abs(nor.getZ(i))];
    const na=n[0]>0.5?0:(n[1]>0.5?1:2);
    const axes=[0,1,2].filter(a=>a!==na);
    let ua,va;
    if(axes.indexOf(L)>=0){ ua=L; va=axes.find(a=>a!==L); } else { ua=axes[0]; va=axes[1]; }
    uv.setXY(i,p[ua]/S+off[0],p[va]/S+off[1]);
  }
  uv.needsUpdate=true;
}

// Curls a scroll sheet by total bend angle A (0 = flat): each row is mapped onto an arc of radius panelH/A,
// keeping its distance from the fixed top edge; the bottom rod follows the free edge.
function updateScrollCurl(A,sc){
  sc=sc||scrollCurl; if(!sc) return;
  const flat=A<1e-4;
  const R=flat?0:sc.panelH/A;
  const bend=(geo,base)=>{
    const pos=geo.attributes.position;
    if(flat){ pos.array.set(base); }
    else{
      for(let i=0;i<pos.count;i++){
        const x0=base[i*3], y0=base[i*3+1], s=-y0/sc.panelH, phi=s*A;
        pos.setXYZ(i,x0,-R*Math.sin(phi),R*(1-Math.cos(phi)));
      }
    }
    pos.needsUpdate=true; geo.computeVertexNormals();
  };
  bend(sc.frontGeo,sc.frontBase); bend(sc.backGeo,sc.backBase);
  const y1=flat?-sc.panelH:-R*Math.sin(A), z1=flat?0:R*(1-Math.cos(A));
  const tx=-Math.cos(A), tz=Math.sin(A);
  sc.bottomRod.position.set(0,y1+0.015*tx,z1+0.015*tz);
  sc.bottomRod.rotation.x=-A;
}

}

}

function fillShelf(x0,x1,y,clear,frontZ,o){
  o=o||{};
  const reserve=o.reserve===undefined?0.11:o.reserve, dMax=o.dMax||0.25;
  let cx=x0+R(0.004,0.012), guard=0;
  let last=null;
  while(cx<x1-reserve-0.02 && guard++<60){
    const st=pick(STYLE_WEIGHTED), df=st.def, spine=pick(st.spines);
    const n=rnd()<0.45?(3+Math.floor(rnd()*5)):(1+Math.floor(rnd()*2));
    const h0=Math.min(clear-0.03,R(df.h[0],df.h[1])*(o.hScale||1));
    const t0=R(df.t[0],df.t[1]), d0=Math.min(dMax,R(0.15,0.25));
    for(let i=0;i<n;i++){
      const t=t0*(n>1?R(0.95,1.05):R(0.85,1.15));
      if(cx+t>x1-reserve) break;
      const h=h0+(n>1?R(-0.002,0.002):R(-0.02,0.02));
      const b=makeBook(st,spine,t,h,d0);
      const pull=rnd()<0.1?R(0.015,0.04):R(-0.004,0.004);
      b.position.set(cx+t/2,y+h/2,frontZ-0.03-d0/2+pull);
      b.rotation.y=R(-0.006,0.006);
      booksG.add(b);
      last={x:cx+t,h:h,d:d0,z:b.position.z};
      cx+=t+R(0.0005,0.003);
    }
    if(rnd()<0.06) cx+=R(0.015,0.04);
  }
  // a leaning book rests against the last standing one
  if(!o.noLean && last){
    const st=pick(STYLE_WEIGHTED), spine=pick(st.spines);
    const t=R(0.022,0.038);
    const h=Math.min(clear-0.03,R(0.2,0.3),last.h-0.015);
    const avail=x1-0.002-last.x;
    if(h>0.12){
      for(const a of [0.3,0.25,0.2,0.16,0.12]){
        const need=h*Math.sin(a)+0.001+t*Math.cos(a);
        if(need<=avail && h*Math.cos(a)<=last.h-0.008){
          const grp=new Group();
          grp.position.set(last.x+h*Math.sin(a)+0.001,y,last.z);
          grp.rotation.z=a;
          const b=makeBook(st,spine,t,h,last.d); b.position.set(t/2,h/2,0); grp.add(b); booksG.add(grp);
          break;
        }
      }
    }
  }
}

function openTrap(){
  try{
    // replace the real tatami tile in front of the shelf, nearest the centre
    const rows=Math.ceil(ROOM_D/0.9), cols=Math.ceil(ROOM_W/1.8)+1, ti=1;
    let bestK=0,bestX=Infinity;
    for(let k=0;k<cols;k++){ const x=-ROOM_W/2+0.9+1.8*k-(ti%2)*0.9; if(Math.abs(x)<Math.abs(bestX)){ bestX=x; bestK=k; } }
    const TRAP_X=bestX, TRAP_ZF=0.9*ti, TRAP_ZN=0.9*ti+0.9, TRAP_W=1.8, TRAP_D=0.9, TRAP_THICK=0.045;
    TRAP_X_G=TRAP_X; TRAP_W_G=TRAP_W; TRAP_ZF_G=TRAP_ZF; TRAP_ZN_G=TRAP_ZN;
    if(tatamiInst){   // remove the real tile this flap replaces
      tatamiInst.setMatrixAt(ti*cols+bestK,new THREE.Matrix4().makeScale(0,0,0));
      tatamiInst.instanceMatrix.needsUpdate=true;
    }
    const zF=TRAP_ZF, zN=TRAP_ZN;
    const z0=zF, z1=zN;
    const N=18, rise=0.19, run=0.24, w=TRAP_D-0.14;
    // The stairwell has its own scene (underScene), drawn only through the opening; its materials are copies.
    underScene=new Scene();
    const uMat=m=>{ const c=m.clone(); c.envMapIntensity*=0.4; return c; };
    const matMidU=uMat(matMid), matDarkU=uMat(matDark);
    const stairs=group(underScene,TRAP_X+TRAP_W/2-0.14,0,(z0+z1)/2);
    for(let i=0;i<N;i++){
      const y=-0.07-rise*i, x=-run*i;
      box(run+0.03,0.045,w,matMidU,x,y,0,stairs);   // tread
      box(0.04,rise+0.02,w,matMidU,x+run/2,y-rise/2+0.03,0,stairs);   // riser
    }
    const doorH=1.29;
    const lastTreadFarX=-run*(N-1)-(run+0.03)/2;
    const landW=w+1.1, doorX=lastTreadFarX-landW, doorY=-0.07-rise*(N-1);
    box(landW,0.05,TRAP_D,matMidU,(lastTreadFarX+doorX)/2,doorY-0.025,0,stairs);   // landing runs right out to the side walls
    const doorHinge=group(stairs,doorX,doorY,-w/2);
    buildHeavyDoor(doorHinge,doorH,w);
    decorateStairwell(stairs,{N,rise,run,w,halfW:TRAP_D/2,openX0:-(TRAP_W-0.14),lastTreadFarX,doorX,doorY,doorH,matDarkU});
    stairDoor={hinge:doorHinge,t:0,goal:0};
    pickables.push(doorHinge);   // any part of the door counts
    STAIR_G.lastTreadFarX=lastTreadFarX; STAIR_G.doorX=doorX; STAIR_G.doorY=doorY; STAIR_G.doorH=doorH;
    trapHinge=group(scene,TRAP_X,0,TRAP_ZF);
    const trapTile=new Mesh(new BoxGeometry(TRAP_W,TRAP_THICK,TRAP_D),
      [matTatami,matTatami,matTatami,matMid,matTatami,matTatami]);   // +x,-x,+y(top),-y(underside),+z,-z
    trapTile.position.set(0,-TRAP_THICK/2,TRAP_D/2);
    trapTile.castShadow=trapTile.receiveShadow=true;
    trapHinge.add(trapTile); pickables.push(trapTile);
    trapCatcher.visible=false;
    const ci=pickables.indexOf(trapCatcher); if(ci>=0) pickables.splice(ci,1);
    // tapping into the open hole starts descendStairs() (tested by ray maths in endPointer, not a mesh)
    stairsOpening={xMin:TRAP_X-TRAP_W/2,xMax:TRAP_X+TRAP_W/2,zMin:TRAP_ZF,zMax:TRAP_ZN,y:-0.05};
    trap.opened=true; trap.goal=1;
  }catch(err){ console.error('hidden puzzle: failed to open',err); }
}
function toggleFlap(){ trap.opened=!trap.opened; trap.goal=trap.opened?1:0; }
// opening a main-room drawer with an item in it: look down into it from above (not too close)
function viewIntoDrawer(mv){
  const it=mv.obj.children.find(c=>c.userData.item); if(!it) return;
  const P=it.getWorldPosition(new Vector3()); P[mv.axis]+=mv.delta*(1-mv.t);   // where it will be once open
  goal.target.copy(P); goal.phi=0.62; goal.r=1.25;
}
// the cellar door opens only for the cellar key; then it swings open and the page moves on to NEXT_PAGE
function tapDoor(){
  if(!stairDoor) return;
  USES.cellarDoor.after=()=>{ stairDoor.goal=1; leaveTo(NEXT_PAGE); };
  if(useAt('cellarDoor')) return;
  const base=stairDoor.hinge.rotation.y; let n=0;   // locked: it rattles
  const id=setInterval(()=>{ stairDoor.hinge.rotation.y=base+(n%2?0.06:-0.06); n++; if(n>5){ clearInterval(id); stairDoor.hinge.rotation.y=base; } },70);
}
// The descent glides the orbit target down the treads (fixed offset, so it reads as walking down), then
// levels off facing the door while pulling in close enough to stay clear of the treads.
let stairsRide=null;
function descendStairs(){
  if(!trap.opened||stairsRide) return;
  const run=0.24, rise=0.19, START_STEP=3, z=(TRAP_ZF_G+TRAP_ZN_G)/2, x0=TRAP_X_G+TRAP_W_G/2-0.14;
  goal.theta=PI/2; goal.phi=0.71; goal.r=3.0;
  const sx=x0-run*START_STEP, sy=-0.07-rise*START_STEP;
  const mx=x0+(STAIR_G.lastTreadFarX+STAIR_G.doorX)/2, my=STAIR_G.doorY;
  const ex=x0+STAIR_G.doorX, ey=STAIR_G.doorY+STAIR_G.doorH/2;
  stairsRide={t:0,duration:5.5,split:0.78,sx,sy,mx,my,ex,ey,z,phi0:0.71,phi1:PI/2,r0:3.0,r1:1.6,openX:x0-(TRAP_W_G-0.14)};
}
function tapTrap(){
  if(trap.revealed) return;
  const now=performance.now();
  if(now-trap.last>TRAP_TAP_WINDOW) trap.taps=0;
  trap.taps++; trap.last=now;
  if(trap.taps>=5){ trap.revealed=true; openTrap(); }
}

// Re-UVs a mesh from world positions (x0..x0+w across, 0..h up) so cut-up wall pieces keep one texture scale.
// Faces along x use z across; faces along y use z up.
function worldUV(mesh,x0,w,h){
  mesh.updateMatrixWorld(true);
  const g=mesh.geometry, p=g.attributes.position, n=g.attributes.normal, uv=g.attributes.uv;
  const v=new Vector3(), nn=new Vector3(), nm=new THREE.Matrix3().getNormalMatrix(mesh.matrixWorld);
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i).applyMatrix4(mesh.matrixWorld); nn.fromBufferAttribute(n,i).applyMatrix3(nm);
    uv.setXY(i,((Math.abs(nn.x)>0.5?v.z:v.x)-x0)/w,(Math.abs(nn.y)>0.5?v.z:v.y)/h);
  }
  uv.needsUpdate=true;
}

/* ---------- the room behind the fusuma: a chic wa-yo (Japanese-Western) sitting room ---------- */
// Own scene (innerScene) and lights, drawn after the main scene into the same depth buffer while the fusuma
// is open. Layout: tokonoma straight ahead of the doorway, display shelf left of it, shoji + bench right of it;
// rug, table, armchairs and lantern in the middle; sofa and lamps on the left wall, sideboard and art on the right.

// walnut herringbone parquet, painted per pixel; seamless every P plank-widths
function drawHerringbone(g,w,h){
  const n=4, P=16, u=w/P;
  const img=g.createImageData(w,h), d=img.data;
  const tone=[]; for(let i=0;i<2*P;i++) tone.push([R(0.74,1.14),R(0,100),R(0.7,1.4),R(-0.06,0.06)]);
  const base=[106,68,41], dark=[48,28,15];
  for(let py=0;py<h;py++){
    const y=(py+0.5)/u, k=Math.floor(y);
    for(let px=0;px<w;px++){
      const x=(px+0.5)/u, m=Math.floor((x-k+n)/(2*n)), xl=x-2*n*m-k;
      let id,along,across;
      if(xl>=0){ id=(((k+2*n*m)%P)+P)%P; along=xl; across=y-k; }
      else{ const j=Math.floor(x-m*n); id=P+((((j-n*m)%P)+P)%P); across=x-m*n-j; along=y-(j+1-m*n); }
      const t0=tone[id];
      const wv=across*t0[2]*7+0.32*Math.sin(along*1.6+t0[1])+0.1*Math.sin(along*5.7+t0[1]*2);
      let gr=0.5+0.5*Math.sin(wv*PI*2); gr=gr*gr*gr;
      const fig=0.5+0.5*Math.sin(along*0.7+t0[1]*0.7+across*2.4);
      const tt=Math.min(1,gr*0.5+fig*0.22+rnd()*0.08);
      let b=t0[0];
      const e=Math.min(across,1-across,along,n-along);
      if(e<0.022) b*=0.3; else if(e<0.06) b*=0.84+0.16*(e-0.022)/0.038;   // hairline joints with a slight eased bevel
      const i4=(py*w+px)*4;
      d[i4]=Math.min(255,(base[0]+(dark[0]-base[0])*tt)*b*(1+t0[3]));
      d[i4+1]=Math.min(255,(base[1]+(dark[1]-base[1])*tt)*b);
      d[i4+2]=Math.min(255,(base[2]+(dark[2]-base[2])*tt)*b*(1-t0[3]));
      d[i4+3]=255;
    }
  }
  g.putImageData(img,0,0);
}

  band(0,w*0.055,'#2a211d');

}
function drawLeather(g,w,h,base){

// soft rounded box (a cushion): a sphere whose vertices are pushed out onto a rounded box, so the
// normals stay smooth. `bulge` puffs the top face up slightly. UVs are projected in metres.
function softBox(w,h,d,r,mat,bulge){
  const g=new SphereGeometry(1,28,18), p=g.attributes.position, uv=g.attributes.uv, v=new Vector3();
  const hx=w/2-r, hy=h/2-r, hz=d/2-r;
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    // near-zero components count as zero (sin(2*PI) isn't exactly 0; Math.sign of it tore the seam open)
    const sg=a=>a>1e-6?1:a<-1e-6?-1:0;
    const x=sg(v.x)*hx+v.x*r, z=sg(v.z)*hz+v.z*r;
    let y=sg(v.y)*hy+v.y*r;
    if(bulge&&v.y>0) y+=bulge*Math.max(0,1-(2*x/w)**2)*Math.max(0,1-(2*z/d)**2);
    p.setXYZ(i,x,y,z);
    const ax=Math.abs(v.x), ay=Math.abs(v.y), az=Math.abs(v.z);
    if(ay>=ax&&ay>=az) uv.setXY(i,x/0.5,z/0.5); else if(ax>=az) uv.setXY(i,z/0.5,y/0.5); else uv.setXY(i,x/0.5,y/0.5);
  }
  g.computeVertexNormals();
  const m=new Mesh(g,mat); m.castShadow=m.receiveShadow=true; return m;
}
// adds mesh m to parent at (x,y,z), optionally turned ry about y and rx about x
function put(m,x,y,z,parent,ry,rx){ m.position.set(x,y,z); if(ry) m.rotation.y=ry; if(rx) m.rotation.x=rx; parent.add(m); return m; }
function cyl(rt,rb,h,mat,seg,open){ const m=new Mesh(new CylinderGeometry(rt,rb,h,seg||24,1,!!open),mat); m.castShadow=m.receiveShadow=true; return m; }

// Board-and-batten ceiling over x0..x1, z0..z1 at height y, with a cornice unless cornice===false.
function battenCeiling(parent,x0,x1,z0,z1,y,trim,cornice){
  const m=new Mesh(new PlaneGeometry(x1-x0,z1-z0),std({map:tCeilBoards,roughness:0.75},0.25));
  m.rotation.x=PI/2; m.position.set((x0+x1)/2,y,(z0+z1)/2); m.receiveShadow=true; parent.add(m); worldUV(m,0,1.8,1.8);
  const b=(w,h,d,x,yy,z)=>{ box(w,h,d,trim,x,yy,z,parent).castShadow=false; };   // no shadows from the ceiling onto the walls
  for(let x=x0+0.45;x<x1-0.1;x+=0.45) b(0.03,0.035,z1-z0,x,y-0.0175,(z0+z1)/2);
  if(cornice!==false){
    b(x1-x0,0.05,0.05,(x0+x1)/2,y-0.025,z0+0.025); b(x1-x0,0.05,0.05,(x0+x1)/2,y-0.025,z1-0.025);
    b(0.05,0.05,z1-z0,x0+0.025,y-0.025,(z0+z1)/2); b(0.05,0.05,z1-z0,x1-0.025,y-0.025,(z0+z1)/2);
  }
  return m;
}

function buildInnerRoom(){
  if(innerRoomBuilt) return; innerRoomBuilt=true;
  try{
    scene.remove(backWall); backWall.geometry.dispose();
    const leftW=doorX0+ROOM_W/2, rightW=ROOM_W/2-doorX1;
    const wSeg1=box(leftW,ROOM_H,WALL_T,matWallA,(-ROOM_W/2+doorX0)/2,ROOM_H/2,-WALL_T/2,scene);
    const wSeg2=box(rightW,ROOM_H,WALL_T,matWallA,(doorX1+ROOM_W/2)/2,ROOM_H/2,-WALL_T/2,scene);
    const wSeg3=box(doorW,ROOM_H-doorH,WALL_T,matWallA,(doorX0+doorX1)/2,(doorH+ROOM_H)/2,-WALL_T/2,scene);
    [wSeg1,wSeg2,wSeg3].forEach(m=>{ m.castShadow=false; m.receiveShadow=true; worldUV(m,-ROOM_W/2,ROOM_W,ROOM_H); });
    // thin dark-wood trim around the opening, mounted on the front face
    box(0.04,doorH+0.04,0.03,matDark,doorX0-0.02,doorH/2,0.02,scene);
    box(0.04,doorH+0.04,0.03,matDark,doorX1+0.02,doorH/2,0.02,scene);
    box(doorW+0.08,0.04,0.03,matDark,(doorX0+doorX1)/2,doorH+0.02,0.02,scene);
    // dark alcove plaster either side of and above the opening
    alcove.geometry.dispose(); alcove.geometry=new PlaneGeometry(1.54-doorX1,ROOM_H);
    alcove.position.x=(doorX1+1.54)/2; worldUV(alcove,-1.54,3.08,ROOM_H);
    const alcoveL=new Mesh(new PlaneGeometry(doorX0+1.54,ROOM_H),matWallB);
    alcoveL.position.set((-1.54+doorX0)/2,ROOM_H/2,alcove.position.z); alcoveL.receiveShadow=true; scene.add(alcoveL);
    worldUV(alcoveL,-1.54,3.08,ROOM_H);
    const alcoveT=new Mesh(new PlaneGeometry(doorW,ROOM_H-doorH),matWallB);
    alcoveT.position.set((doorX0+doorX1)/2,(doorH+ROOM_H)/2,alcove.position.z); alcoveT.receiveShadow=true; scene.add(alcoveT);
    worldUV(alcoveT,-1.54,3.08,ROOM_H);
    // a fusuma panel across the opening, sliding sideways to reveal the room beyond
    const newDoor=fusumaDoor(doorW,doorH);
    newDoor.position.set((doorX0+doorX1)/2,doorH/2,0.03); scene.add(newDoor);
    makeMovable(newDoor,'x',doorW+0.02,'inner-door');
    innerDoorMv=newDoor.userData.mv;
    TARGET_MIN.z=INNER_Z1+0.15;
  }catch(err){ console.error('inner room: failed to build',err); }
}

// a cord from points pts (y-up), ending in a tassel at its last point
function cordTassel(g,pts,cordMat,capMat){
  const c=new CatmullRomCurve3(pts.map(p=>new Vector3(...p)));
  mk(new TubeGeometry(c,24,0.0011,6),cordMat,g);
  const e=pts[pts.length-1], d=c.getTangentAt(1);
  const t=new Group(); t.position.set(...e); t.quaternion.setFromUnitVectors(new Vector3(0,-1,0),d); g.add(t);
  mk(new CylinderGeometry(0.0022,0.0022,0.004,12),capMat,t,0,-0.002,0);
  mk(new ConeGeometry(0.0042,0.018,14,1,true).rotateX(PI),cordMat,t,0,-0.013,0).material.side=DoubleSide;
}

// Tap handler for a USES place. Returns true if it opened / was already open.
function useAt(key){
  const u=USES[key];
  if(u.open){ if(u.after) u.after(); else if(u.done) toast(u.done); return true; }
  const ok=u.item&&(selItem===u.item||(u.held&&inv.includes(u.item)));
  if(!ok){ toast(selItem&&u.item?ITEMS[selItem].name+'は、ここでは使えないようだ。':u.hint); return false; }
  if(u.consume) dropItem(u.item);
  if(selItem===u.item) selItem=null;
  u.open=true; if(u.unlock) USES[u.unlock].open=true;
  toast(u.msg); if(u.onUse) u.onUse(); if(u.after&&u.openNow!==false) u.after();
  if(u.give) setTimeout(()=>giveItem(u.give),2600);
  renderItems(); return true;
}
// Puts a hidden-room object behind USES[key]: until it's used, a tap shows the hint; afterwards a tap does
// what it did before (its existing innerAct). onUse runs once when unlocked; openNow:false = don't also tap it then.
function lockable(obj,key,onUse,openNow){

  obj.userData.useKey=key; obj.userData.innerAct=()=>useAt(key); return obj;
}

  obj.userData.item=id;
  // a larger invisible hit box around it (2.5cm margin), so it's easy to tap
  const bb=new THREE.Box3(); obj.updateMatrixWorld(true);
  obj.traverse(o=>{ if(o.isMesh){ o.geometry.computeBoundingBox(); bb.union(o.geometry.boundingBox.clone().applyMatrix4(new THREE.Matrix4().copy(obj.matrixWorld).invert().multiply(o.matrixWorld))); } });
  const sz=bb.getSize(new Vector3()).addScalar(0.05), hit=new Mesh(new BoxGeometry(sz.x,sz.y,sz.z),HIT_MAT);
  bb.getCenter(hit.position); obj.add(hit);
  if(inner){ obj.userData.innerAct=()=>pickUp(obj); obj.userData.noFocus=true; } else pickables.push(obj);
  return obj;
}
const HIT_MAT=new MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false,colorWrite:false});
const inv=[];               // ids held, in pick-up order
let selItem=null, lbItem=null;
function pickUp(obj){
  obj.parent.remove(obj); const i=pickables.indexOf(obj); if(i>=0) pickables.splice(i,1);
  giveItem(obj.userData.item);
}
function giveItem(id){ inv.push(id); renderItems(); toast(ITEMS[id].name+'を手に入れた'); }
function drawIcon(c,id){ const g=c.getContext('2d'); g.clearRect(0,0,c.width,c.height); g.imageSmoothingQuality='high'; g.drawImage(itemStill(id),0,0,c.width,c.height); }
const SLOTS=8;
function renderItems(){
  const bar=$('items'); bar.textContent='';
  for(let i=0;i<Math.max(SLOTS,inv.length);i++){
    const id=inv[i], b=document.createElement('button'); b.type='button';
    if(!id){ b.className='empty'; b.disabled=true; bar.appendChild(b); continue; }
    const c=document.createElement('canvas'); c.width=c.height=128; drawIcon(c,id); b.appendChild(c);
    b.title=ITEMS[id].name; if(id===selItem) b.className='sel';
    b.onclick=()=>tapSlot(id); bar.appendChild(b);
  }
}
// one tap selects; tapping the selected item again opens the lightbox; with the lightbox open, tapping another combines
function tapSlot(id){
  if(lbItem){ if(id!==lbItem) combine(lbItem,id); return; }
  if(selItem===id) openLb(id); else selItem=id;
  renderItems();
}
function combine(a,b){
  const r=RECIPES.find(([x,y])=>(x===a&&y===b)||(x===b&&y===a));
  if(!r){ lbMsg(ITEMS[b].name+'とは組み合わせられないようだ'); return; }
  dropItem(a); dropItem(b); inv.push(r[2]); selItem=r[2];
  openLb(r[2]); lbMsg(r[3]||ITEMS[a].name+'と'+ITEMS[b].name+'を合わせて、'+ITEMS[r[2]].name+'になった'); renderItems();
}
const lb=$('lb');
let lbAlt=false;   // showing the item's other state (e.g. the scroll unrolled)
function showLb(id){ drawIcon(lb.querySelector('canvas'),id); lb.querySelector('.desc').textContent=ITEMS[id].desc; }
function openLb(id){ lbItem=id; lbAlt=false; drawIcon(lb.querySelector('canvas'),id); lb.querySelector('b').textContent=ITEMS[id].name; lb.querySelector('.desc').textContent=ITEMS[id].desc; lbMsg(''); lb.hidden=false; }
function closeLb(){ lb.hidden=true; lbItem=null; }
function lbMsg(t){ lb.querySelector('.msg').textContent=t; }
lb.addEventListener('click',e=>{ if(e.target===lb||e.target.classList.contains('x')) closeLb(); });
lb.querySelector('canvas').addEventListener('click',()=>{ const alt=lbItem&&ITEMS[lbItem].alt; if(!alt) return; lbAlt=!lbAlt; showLb(lbAlt?alt:lbItem); });
window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLb(); });
let toastT=0;
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),1600+t.length*90); }
// main-room pick-up: a box of matches in the bottom drawer

/* ---------- walking into the hidden room, and looking all the way round inside it ---------- */
// Tapping the fusuma glides the camera in (roomRide); inside (roomView) drag looks round, pinch/wheel zooms,
// two fingers walk, tapping a prop moves it and steps over to it. 部屋を出る / 位置をリセット lead back.
const DOOR_CX=(doorX0+doorX1)/2;
const ROOM_EYE=new Vector3(DOOR_CX,1.42,-1.75);
const DOOR_FRONT=new Vector3(DOOR_CX,1.42,1.1);
function camOffset(th,ph,r){ const sp=Math.sin(ph); return new Vector3(r*sp*Math.sin(th),r*Math.cos(ph),r*sp*Math.cos(th)); }
// kf: [{u, th, ph}] view-direction keys at fractions u of the (eased) ride; path: a smooth curve for the eye
function startRoomRide(points,kf,duration,done){
  roomRide={t:0,duration,curve:new CatmullRomCurve3(points,false,'centripetal'),kf,done};

}
function updateRoomRide(dt){
  const R_=roomRide; R_.t=Math.min(1,R_.t+dt/R_.duration);
  const e=ease(R_.t), P=R_.curve.getPointAt(e), k=R_.kf;
  let i=0; while(i<k.length-2&&e>k[i+1].u) i++;
  const f=clamp((e-k[i].u)/(k[i+1].u-k[i].u),0,1), th=lerp(k[i].th,k[i+1].th,f), ph=lerp(k[i].ph,k[i+1].ph,f), r=0.05;
  cur.theta=goal.theta=th; cur.phi=goal.phi=ph; cur.r=goal.r=r;
  cur.target.copy(P).sub(camOffset(th,ph,r)); goal.target.copy(cur.target);
  if(R_.t>=1){ roomRide=null; R_.done(); }
}
// glide the eye to E while turning to look at P (inside the room)
function lookRide(E,P,dur,done){
  const d=P.clone().sub(E).normalize();
  let th=Math.atan2(-d.x,-d.z); const ph=Math.acos(clamp(-d.y,-1,1));
  th+=Math.round((cur.theta-th)/(PI*2))*PI*2;   // turn the short way round
  const from=camera.position.clone(); if(from.distanceTo(E)<0.02) E=E.clone().add(new Vector3(0,0.02,0));
  startRoomRide([from,E],[{u:0,th:cur.theta,ph:cur.phi},{u:1,th,ph}],dur,done||(()=>{}));
}
// after tapping something that moves: step over to it -- about a metre away, a little above it, looking at it
// dir/elev given (a set view): from that side, elev radians above level; otherwise from where we stand
function focusInnerPoint(P,dist,dir,elev){
  if(roomRide) return;
  let E;
  if(dir){ const d=new Vector3(dir.x,0,dir.z).normalize();
    E=P.clone().addScaledVector(d,dist*Math.cos(elev)); E.y+=dist*Math.sin(elev); E.y=clamp(E.y,0.4,2.5); }
  else{ const dh=new Vector3(camera.position.x-P.x,0,camera.position.z-P.z);
    if(dh.lengthSq()<1e-6) dh.set(0,0,1); dh.normalize();
    E=P.clone().addScaledVector(dh,dist||1.15); E.y=clamp(P.y+(dist?0.15:0.45),1.0,1.6); }
  E.x=clamp(E.x,-3.9,3.9); E.z=clamp(E.z,INNER_Z1+0.35,INNER_Z0-0.35);
  lookRide(E,P,1.6);
}
// two-finger drag inside the room: sideways drag steps sideways, up/down drag walks forward/back
function walkBy(dx,dy){
  if(roomRide) return;
  const f=new Vector3(-Math.sin(goal.theta),0,-Math.cos(goal.theta)), r=new Vector3(-f.z,0,f.x), k=0.006;
  goal.target.addScaledVector(r,-dx*k).addScaledVector(f,dy*k);
  goal.target.x=clamp(goal.target.x,-3.8,3.8); goal.target.z=clamp(goal.target.z,INNER_Z1+0.5,INNER_Z0-0.4);
}
function backToRoomCentre(){ if(roomRide) return; roomFov=60;   // also undo any pinch/wheel zoom
  lookRide(ROOM_EYE.clone(),ROOM_EYE.clone().add(new Vector3(0,-0.05,-1)),1.6); }
function enterInnerRoom(){
  if(!innerDoorMv||roomRide||roomView) return;
  innerDoorMv.goal=1;
  const th0=cur.theta, th1=Math.round(th0/(PI*2))*PI*2;   // face straight into the room, turning the short way
  startRoomRide([camera.position.clone(),DOOR_FRONT.clone(),ROOM_EYE.clone()],
    [{u:0,th:th0,ph:cur.phi},{u:0.45,th:th1,ph:PI/2},{u:1,th:th1,ph:1.6}],3.4,
    ()=>{ roomView=true; innerVisited=true; $('bExit').hidden=false; $('items').hidden=false; renderItems(); });
}
function exitInnerRoom(){
  if(!roomView||roomRide) return;
  roomView=false; $('bExit').hidden=true;
  const th0=cur.theta, k=Math.round(th0/(PI*2))*PI*2;
  const homeCam=home.target.clone().add(camOffset(home.theta,home.phi,home.r));
  const pts=[camera.position.clone()]; if(camera.position.distanceTo(ROOM_EYE)>0.1) pts.push(ROOM_EYE.clone());
  pts.push(DOOR_FRONT.clone(),homeCam);
  startRoomRide(pts,
    [{u:0,th:th0,ph:cur.phi},{u:0.3,th:k,ph:PI/2},{u:0.6,th:k,ph:PI/2},{u:1,th:k+home.theta,ph:home.phi}],pts.length>3?4.0:3.2,
    ()=>{ innerDoorMv.goal=0;
      cur.theta=goal.theta=home.theta; cur.phi=goal.phi=home.phi; cur.r=goal.r=home.r;
      cur.target.copy(home.target); goal.target.copy(home.target); });
}
$('bExit').addEventListener('click',exitInnerRoom);
// built at startup (not drawn until the fusuma opens) and pre-rendered once in tick(), so the first open doesn't stall
const tCeilBoards=canvasTex(512,512,drawCeilBoards), tWainscot=canvasTex(512,512,drawWainscot), tWalnut=woodTex('#4a2c1a','20,10,5','138,90,54',60,0.8);
// plaster for the hidden room and stairwell: the alcove's texture, tinted per wall
const plaster=(hex,env)=>{ const c=C(hex), b=C('#6c5842'); c.r/=b.r; c.g/=b.g; c.b/=b.b;   // tint = wanted colour / the texture's own
  return std({map:tPlasterB,bumpMap:tPlasterB,bumpScale:0.7,roughness:0.96,color:c},env); };
battenCeiling(scene,-ROOM_W/2,ROOM_W/2,0,ROOM_D,ROOM_H,matDark);
innerRoom=buildInnerInterior(INNER_Z0,INNER_Z1); innerScene=innerRoom.scene;

/* ---------- buttons ---------- */
const shojiMvs=movables.filter(m=>m.tag==='shoji');
function setShoji(open){
  shojiMvs.forEach(m=>{ m.goal=open?1:0; });
}
$('bReset').addEventListener('click',()=>{
  if(roomRide) return;
  if(roomView){ backToRoomCentre(); return; }
  goal.theta=home.theta; goal.phi=home.phi; goal.r=home.r; goal.target.copy(home.target);
});
setTimeout(()=>{ $('hint').style.opacity='0'; },14000);

/* ---------- loop ---------- */
const clock=new THREE.Clock(); let first=true;
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05), time=clock.elapsedTime;
  for(const m of movables) if(step(m,dt,7)!==null) m.obj.position[m.axis]=m.base+m.delta*m.t;
  let e;
  if(trapHinge&&(e=step(trap,dt,1.6))!==null) trapHinge.rotation.x=-PI/2*e;
  if(stairsRide){
    const R=stairsRide; R.t=Math.min(1,R.t+dt/R.duration);
    if(R.t<=R.split){
      const f=ease(R.t/R.split);
      goal.target.set(lerp(R.sx,R.mx,f),lerp(R.sy,R.my,f),R.z); goal.phi=R.phi0; goal.r=R.r0;
    }else{
      const f=ease((R.t-R.split)/(1-R.split));
      goal.target.set(lerp(R.mx,R.ex,f),lerp(R.my,R.ey,f),R.z); goal.phi=lerp(R.phi0,R.phi1,f); goal.r=lerp(R.r0,R.r1,f);
    }
    // dip under the stairwell ceiling's front edge, where the trailing camera would otherwise pass through it
    { const camX=goal.target.x+goal.r*Math.sin(goal.phi), u=(camX-R.openX)/0.95;
      if(Math.abs(u)<1) goal.target.y-=0.42*(1-u*u)*(1-u*u); }
    if(R.t>=1) stairsRide=null;
  }
  if(stairDoor&&(e=step(stairDoor,dt,1.8))!==null) stairDoor.hinge.rotation.y=-PI*0.72*e;
  if(scrollCurl&&(e=step(scrollSwing,dt,3))!==null) updateScrollCurl(scrollCurl.maxAngle*e);
  if(handleGroup&&Math.abs(handleSpin.target-handleSpin.angle)>0.001){ handleSpin.angle+=(handleSpin.target-handleSpin.angle)*(1-Math.exp(-dt*2.2)); handleGroup.rotation.z=handleSpin.angle; }
  if((e=step(shelfSlide,dt,2))!==null) shelf.position.x=SHELF_SLIDE_DIST*e;
  if(roomRide) updateRoomRide(dt);
  innerRoom.update(dt);
  const k=1-Math.exp(-dt*6);
  { const fw=roomView?roomFov:baseFov(); if(Math.abs(camera.fov-fw)>0.01){ camera.fov+=(fw-camera.fov)*(1-Math.exp(-dt*3)); camera.updateProjectionMatrix(); } }
  cur.theta+=(goal.theta-cur.theta)*k; cur.phi+=(goal.phi-cur.phi)*k; cur.r+=(goal.r-cur.r)*k; cur.target.lerp(goal.target,k);
  const sp=Math.sin(cur.phi);
  camera.position.set(cur.target.x+cur.r*sp*Math.sin(cur.theta),cur.target.y+cur.r*Math.cos(cur.phi),cur.target.z+cur.r*sp*Math.cos(cur.theta));
  camera.lookAt(cur.target);
  lampLight.intensity=1.9*(1+0.04*Math.sin(time*7.3)*Math.sin(time*2.1));
  updateShowcase(dt,time);
  renderer.render(scene,camera);
  // the hidden room and the stairwell draw into the same depth buffer, only while visible
  if(innerScene&&innerDoorMv&&innerDoorMv.t>0.002){ renderer.autoClear=false; renderer.render(innerScene,camera); renderer.autoClear=true; }
  if(underScene&&(trap.t>0.002||camera.position.y<0.05)){ renderer.autoClear=false; renderer.render(underScene,camera); renderer.autoClear=true; }
  if(first){ first=false; renderer.autoClear=false; renderer.render(innerScene,camera); renderer.autoClear=true;   // warm-up, hidden by the loading screen
    loadingEl.style.opacity='0'; setTimeout(()=>loadingEl.remove(),1000); }
}
tick();
})();
</script>
